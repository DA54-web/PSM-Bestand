<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PSM-Bestandsbuch</title>
<style>
  :root{
    --bg:#f5f3ed;
    --card:#ffffff;
    --line:#e2ddd0;
    --ink:#20241f;
    --ink-soft:#5b6058;
    --green:#2b4735;
    --green-dark:#1c3024;
    --amber:#c98a2e;
    --amber-soft:#f4e2c4;
    --red:#b3261e;
    --red-soft:#f6dcda;
    --radius:14px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{padding-top:calc(var(--safe-top) + 8px);padding-bottom:calc(64px + var(--safe-bottom) + 12px);
    min-height:100vh;}
  input,select,button,textarea{font-size:16px;font-family:inherit;} /* verhindert iOS-Zoom bei Fokus */

  header.top{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;
    padding:calc(var(--safe-top) + 10px) 16px 12px;display:flex;align-items:center;justify-content:space-between;}
  header.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;}
  header.top .sync-btn{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:10px;
    padding:8px 12px;font-size:13px;display:flex;align-items:center;gap:6px;}
  header.top .sync-dot{width:8px;height:8px;border-radius:50%;background:#8fd19e;}
  header.top .sync-dot.warn{background:var(--amber);}

  main{padding:12px 14px;max-width:640px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:12px;}
  .card h2{font-size:15px;margin:0 0 10px;color:var(--green-dark);}
  .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;
    border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .row .name{font-weight:600;font-size:15px;}
  .row .sub{color:var(--ink-soft);font-size:13px;margin-top:2px;}
  .amount{font-weight:700;font-size:16px;}
  .badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;}
  .badge.warn{background:var(--red-soft);color:var(--red);}

  label{display:block;font-size:13px;color:var(--ink-soft);margin:10px 0 4px;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;padding:12px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);}
  textarea{resize:vertical;min-height:60px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:13px 16px;border-radius:12px;border:none;font-weight:700;font-size:15px;width:100%;
    min-height:48px;}
  .btn-primary{background:var(--green);color:#fff;}
  .btn-amber{background:var(--amber);color:#fff;}
  .btn:disabled{opacity:.55;pointer-events:none;}
  .btn-outline{background:transparent;border:1.5px solid var(--green);color:var(--green);}
  .btn-danger{background:var(--red);color:#fff;}
  .btn-sm{padding:9px 12px;font-size:13px;width:auto;min-height:40px;}
  .btn-row{display:flex;gap:8px;margin-top:10px;}
  .btn-row .btn{flex:1;}

  .searchbox{position:relative;}
  .search-results{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);
    border-top:none;border-radius:0 0 10px 10px;max-height:260px;overflow-y:auto;z-index:10;}
  .search-results div{padding:11px 12px;border-bottom:1px solid var(--line);font-size:14px;}
  .search-results div small{display:block;color:var(--ink-soft);}

  nav.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
    display:flex;padding-bottom:var(--safe-bottom);z-index:6;}
  nav.bottom button{flex:1;background:none;border:none;padding:10px 4px 8px;color:var(--ink-soft);
    font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;}
  nav.bottom button.active{color:var(--green);font-weight:700;}
  nav.bottom .icon{font-size:20px;}

  .empty{text-align:center;color:var(--ink-soft);padding:24px 10px;font-size:14px;}
  .hidden{display:none !important;}
  .toast{position:fixed;bottom:calc(76px + var(--safe-bottom));left:16px;right:16px;background:var(--green-dark);
    color:#fff;padding:12px 16px;border-radius:12px;text-align:center;font-size:14px;z-index:20;
    opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateY(0);}
  .detail-field{margin-bottom:10px;}
  .detail-field .k{font-size:12px;color:var(--ink-soft);}
  .detail-field .v{font-size:14px;}
  .back-link{color:var(--green);font-size:14px;margin-bottom:10px;display:inline-block;}
</style>
</head>
<body>

<header class="top">
  <h1>🌾 PSM-Bestandsbuch</h1>
  <button class="sync-btn" id="syncBtn"><span class="sync-dot" id="syncDot"></span><span id="syncLabel">Sync</span></button>
</header>

<main id="main"></main>

<nav class="bottom">
  <button data-view="start" class="active"><span class="icon">📦</span>Bestand</button>
  <button data-view="buchen"><span class="icon">✍️</span>Buchen</button>
  <button data-view="historie"><span class="icon">📜</span>Historie</button>
</nav>

<div class="toast" id="toast"></div>

<div id="scannerOverlay" class="hidden" style="position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column">
  <video id="scannerVideo" autoplay playsinline style="flex:1;width:100%;object-fit:cover"></video>
  <div style="padding:16px;background:#000;padding-bottom:calc(16px + var(--safe-bottom))">
    <button class="btn btn-outline" id="scannerAbbrechen" style="border-color:#fff;color:#fff">Abbrechen</button>
  </div>
</div>

<script>
/* ============================================================
   KONFIGURATION – hier die Web-App-URL deines Apps Scripts eintragen
   ============================================================ */
const APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyM9cTcewhFnXRuwF2dVtUXaglPnnEyPd1khHX9WH0qFcYxLpo_CKEOZuU0XCUxd6m6/exec';
const SYNC_INTERVAL_MS = 22000;

/* ============================================================
   STATE
   ============================================================ */
let state = {
  buchungen: [],
  katalog: [],
  katalogLoaded: false,
  letzterSync: null,
  view: 'start'
};
let buchungEditId = null;
let buchungWirdGespeichert = false; // sperrt Einbuchen/Ausbuchen gegen Doppelklick/Doppel-Tap, bis der Request fertig ist
let bestandKulturFilter = '';
let bestandSuche = '';
let historieFilter = '';
let einbuchenDraft = { suche: '', kennr: '', handelsname: '', menge: '', einheit: 'l', datum: '', charge: '', person: '', manuell: false, manuellName: '', weitereChargen: [] };
let ausbuchenDraft = { kennr: '', charge: '', menge: '', datum: '', person: '', kommentar: '' };
let exportDraft = { typ: 'buchungen', von: '', bis: '', format: 'csv' };

/* ============================================================
   ROBUSTE FETCH-HELFER
   ============================================================ */
async function apiGet(action){
  const url = APP_SCRIPT_URL + (APP_SCRIPT_URL.includes('?') ? '&' : '?') + 'action=' + action;
  for (let attempt = 0; attempt < 4; attempt++){
    try{
      const res = await fetch(url, { method:'GET' });
      const data = await res.json();
      if (data.ok) return data;
      throw new Error(data.error || 'Unbekannter Serverfehler');
    }catch(err){
      if (attempt === 3) throw err;
      await sleep(500 * Math.pow(2, attempt));
    }
  }
}

async function apiPost(action, payload){
  const body = JSON.stringify(Object.assign({ action }, payload));
  for (let attempt = 0; attempt < 4; attempt++){
    try{
      const res = await fetch(APP_SCRIPT_URL, {
        method:'POST',
        headers:{ 'Content-Type':'text/plain' }, // vermeidet CORS-Preflight bei Apps Script
        body
      });
      const data = await res.json();
      if (data.ok) return data.result;
      throw new Error(data.error || 'Unbekannter Serverfehler');
    }catch(err){
      if (attempt === 3) throw err;
      await sleep(500 * Math.pow(2, attempt));
    }
  }
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

/** Erzeugt eine zufällige ID für die Idempotenzprüfung beim Einbuchen (siehe addBuchung_
 *  in Code.gs) – verhindert, dass ein automatischer apiPost-Retry nach einem Netzwerk-
 *  Fehler (Antwort kam nicht an, Buchung wurde aber bereits angelegt) eine Buchung
 *  doppelt anlegt. crypto.randomUUID() ist nicht überall verfügbar (z.B. älteres
 *  Safari/WebView ohne HTTPS-Kontext), daher mit Fallback. */
function neueClientRequestId(){
  if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
  return 'crid-' + Date.now() + '-' + Math.random().toString(36).slice(2);
}

/* ============================================================
   SYNC
   ============================================================ */
async function syncOperativeData(showToast, isPeriodic){
  setSyncStatus('lädt');
  try{
    const data = await apiGet('data');
    state.buchungen = data.buchungen || [];
    state.letzterSync = data.letzterSync;
    setSyncStatus('ok');
    // Der automatische Hintergrund-Sync (alle 22s) zeichnet die Seite NICHT neu, damit
    // laufende Eingaben in irgendeinem Feld nie überschrieben werden können – egal wo.
    // Die frischen Daten stehen trotzdem sofort bereit, sobald als Nächstes durch eine
    // echte Nutzeraktion (Klick, Tab-Wechsel, manueller Sync-Button) neu gezeichnet wird.
    if (!isPeriodic) render();
    if (showToast) toast('Aktualisiert');
  }catch(err){
    setSyncStatus('fehler');
    if (showToast) toast('Sync fehlgeschlagen: ' + err.message);
    // WICHTIG: bei Fehler bleiben die zuletzt bekannten Daten unverändert (kein leeres Überschreiben)
  }
}


/* ============================================================
   LOKALER KATALOG-CACHE (größter Hebel gegen lange Ladezeiten)
   ============================================================
   Der BVL-Katalog ändert sich nur beim monatlichen Sync, wird bisher aber bei
   JEDEM Seitenaufruf komplett neu vom Server gelesen und übertragen (potenziell
   viele hundert/tausend Zeilen über 11 Kulturen) – das ist der Hauptgrund für
   lange Ladezeiten. Jetzt: Katalog wird im Browser (localStorage) zwischengespeichert;
   bei erneutem Öffnen der Seite wird er sofort aus dem Cache angezeigt, und im
   Hintergrund nur eine winzige Anfrage (letzterSync-Zeitstempel) gestellt. Nur wenn
   sich dieser Zeitstempel geändert hat (= es gab seither einen echten Sync), wird der
   volle Katalog neu heruntergeladen. */
const KATALOG_CACHE_KEY = 'psmKatalogCacheV1';

function ladeKatalogCache_(){
  try{
    const raw = localStorage.getItem(KATALOG_CACHE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.katalog)) return null;
    return parsed;
  }catch(e){ return null; } // z.B. privates Browsing/Speicher blockiert – dann einfach ohne Cache weiter
}

function speichereKatalogCache_(letzterSync, katalog){
  try{
    localStorage.setItem(KATALOG_CACHE_KEY, JSON.stringify({ letzterSync, katalog }));
  }catch(e){ /* Speicher voll o.ä. – Cache ist nur eine Beschleunigung, kein Fehler nötig */ }
}

async function loadKatalogOnce(){
  if (state.katalogLoaded) return;

  const cache = ladeKatalogCache_();
  if (cache){
    // Sofort mit dem Cache-Stand anzeigen, statt auf den vollen Download zu warten
    state.katalog = cache.katalog;
    state.katalogLoaded = true;
    render();
    try{
      const stand = await apiGet('stand'); // günstige Anfrage, liefert nur den Zeitstempel
      if (stand.letzterSync && stand.letzterSync === cache.letzterSync) return; // Cache ist aktuell
    }catch(e){ return; } // Stand-Check fehlgeschlagen: mit dem Cache-Stand weiterarbeiten, kein Fehler-Toast
  }

  try{
    const data = await apiGet('katalog');
    state.katalog = data.katalog || [];
    state.katalogLoaded = true;
    speichereKatalogCache_(data.letzterSync || null, state.katalog);
    render();
  }catch(err){
    if (!state.katalogLoaded){
      toast('PSM-Katalog konnte nicht geladen werden: ' + err.message);
    }
    // War bereits ein Cache-Stand geladen, bleibt dieser einfach stehen (kein störender Toast)
  }
}

function setSyncStatus(status){
  const dot = document.getElementById('syncDot');
  const label = document.getElementById('syncLabel');
  if (status === 'ok'){ dot.className = 'sync-dot'; label.textContent = 'Sync'; }
  else if (status === 'lädt'){ dot.className = 'sync-dot warn'; label.textContent = '…'; }
  else { dot.className = 'sync-dot warn'; label.textContent = 'Fehler'; }
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

/* ============================================================
   BESTANDSBERECHNUNG (aus Buchungen)
   ============================================================ */
function berechneBestand(alleAnzeigen){
  const map = {}; // kennr -> {handelsname, gesamt, einheit, chargen:{charge:menge}}
  state.buchungen.forEach(b => {
    if (!map[b.kennr]) map[b.kennr] = { kennr:b.kennr, handelsname:b.handelsname, gesamt:0, einheit:'', chargen:{} };
    const vz = b.typ === 'Ausbuchung' ? -1 : 1;
    const menge = parseFloat(b.menge) || 0;
    map[b.kennr].gesamt += vz * menge;
    if (b.einheit) map[b.kennr].einheit = b.einheit; // jeweils letzte bekannte Einheit
    const charge = b.charge || '(ohne Charge)';
    map[b.kennr].chargen[charge] = (map[b.kennr].chargen[charge] || 0) + vz * menge;
  });
  if (alleAnzeigen) return Object.values(map); // auch Produkte mit 0 Bestand (schon mal eingebucht, aktuell leer)
  return Object.values(map).filter(p => Math.abs(p.gesamt) > 0.0001);
}

function katalogEintrag(kennr){
  return state.katalog.filter(k => k.kennr === kennr);
}

/**
 * Versucht, aus den Wartezeit-Rohdaten (JSON aus der BVL-API, Feld-Layout nicht
 * zu 100% dokumentiert) eine Anzahl Tage zu extrahieren. Probiert dafür mehrere
 * plausible Feldnamen durch. Gibt null zurück, wenn nichts Eindeutiges gefunden
 * wird – dann wird an anderer Stelle auf die Rohdaten zurückgefallen, statt eine
 * falsche Zahl vorzutäuschen.
 */
function extrahiereWartezeitTage(wartezeitRohJson){
  if (!wartezeitRohJson) return null;
  let eintraege;
  try { eintraege = JSON.parse(wartezeitRohJson); } catch(e) { return null; }
  if (!Array.isArray(eintraege) || eintraege.length === 0) return null;
  const kandidatenFelder = ['wartezeit_tage', 'wartezeit', 'tage', 'anzahl_tage', 'frist_tage'];
  for (const eintrag of eintraege){
    for (const feld of kandidatenFelder){
      const wert = eintrag[feld];
      if (wert !== undefined && wert !== null && wert !== '' && !isNaN(parseFloat(wert))){
        return parseFloat(wert);
      }
    }
  }
  return null;
}

function istAbgelaufen(zulEnde){
  if (!zulEnde) return false;
  const d = new Date(zulEnde);
  return d.getTime() < Date.now();
}

/* ============================================================
   RENDER: ROUTER
   ============================================================ */
function render(){
  const main = document.getElementById('main');
  if (state.view === 'start') main.innerHTML = renderStart();
  else if (state.view === 'buchen') main.innerHTML = renderBuchen();
  else if (state.view === 'historie') main.innerHTML = renderHistorie();
  else if (state.view === 'produkt') main.innerHTML = renderProduktDetail(state.detailKennr);

  attachHandlers();
}

/* ---------- START: Bestandsübersicht ---------- */
function renderStart(){
  const bestand = berechneBestand(true);
  if (bestand.length === 0){
    return `<div class="card"><div class="empty">Noch kein Bestand erfasst.<br>Nutze unten „Buchen“, um PSM einzubuchen.</div></div>`;
  }

  // Jedem Bestandsprodukt seine Kultur(en) aus dem Katalog anhängen (auch hier schon nötig,
  // um die Kultur-Filterliste unten aufzubauen)
  bestand.forEach(p => {
    const katalog = katalogEintrag(p.kennr);
    p._kulturen = [...new Set(katalog.map(k => k.kultur_name).filter(Boolean))];
  });
  const alleKulturen = [...new Set(bestand.flatMap(p => p._kulturen))].sort((a,b) => a.localeCompare(b, 'de'));

  const filterHtml = `
    <div class="card">
      ${alleKulturen.length ? `
        <label>Nach Kultur filtern</label>
        <select id="bestandKulturFilter">
          <option value="">Alle Kulturen</option>
          ${alleKulturen.map(k => `<option value="${escapeHtml(k)}" ${bestandKulturFilter === k ? 'selected' : ''}>${escapeHtml(k)}</option>`).join('')}
        </select>
      ` : ''}
      <label>Suche (Produktname oder Wirkstoff)</label>
      <input type="text" id="bestandSuche" placeholder="z.B. Handelsname oder Wirkstoff…" value="${escapeHtml(bestandSuche)}">
    </div>
  `;

  const exportHtml = `
    <div class="card">
      <h2>Export</h2>
      <label>Was möchtest du exportieren?</label>
      <select id="exportTyp">
        <option value="buchungen" ${exportDraft.typ === 'buchungen' ? 'selected' : ''}>Komplette Buchungshistorie</option>
        <option value="bestand" ${exportDraft.typ === 'bestand' ? 'selected' : ''}>Aktueller Lagerbestand (Momentaufnahme)</option>
      </select>
      ${exportDraft.typ === 'buchungen' ? `
        <label>Zeitraum (optional – leer lassen für alle Buchungen)</label>
        <div style="display:flex;gap:8px">
          <div style="flex:1"><input type="date" id="exportVon" value="${exportDraft.von}"></div>
          <div style="flex:1"><input type="date" id="exportBis" value="${exportDraft.bis}"></div>
        </div>
      ` : ''}
      <label>Format</label>
      <select id="exportFormat">
        <option value="csv" ${exportDraft.format === 'csv' ? 'selected' : ''}>CSV (für Excel/Ackerschlagdatei)</option>
        <option value="pdf" ${exportDraft.format === 'pdf' ? 'selected' : ''}>PDF (Druckansicht – "Als PDF speichern")</option>
      </select>
      <div class="btn-row"><button class="btn btn-outline" id="exportBuchungenBtn">Exportieren</button></div>
    </div>
  `;

  return `${filterHtml}<div class="card" id="bestandListe">${renderBestandListe()}</div>${exportHtml}`;
}

/** Erzeugt nur den Inhalt der Bestandsliste (Überschrift + Zeilen), gefiltert nach Kultur
 *  UND Suchtext. Ausgelagert, damit die Suche beim Tippen nur diesen Teil neu zeichnen
 *  muss (nicht die ganze Seite inkl. Eingabefeld – sonst geht der Fokus verloren). */
function renderBestandListe(){
  const bestand = berechneBestand(true);
  bestand.forEach(p => {
    const katalog = katalogEintrag(p.kennr);
    p._kulturen = [...new Set(katalog.map(k => k.kultur_name).filter(Boolean))];
  });

  let gefiltert = bestandKulturFilter
    ? bestand.filter(p => p._kulturen.includes(bestandKulturFilter))
    : bestand;

  const q = bestandSuche.trim().toLowerCase();
  if (q){
    gefiltert = gefiltert.filter(p => {
      const katalog = katalogEintrag(p.kennr);
      const wirkstoffe = katalog.map(k => k.wirkstoffe || '').join(' ').toLowerCase();
      return (p.handelsname || '').toLowerCase().includes(q) || wirkstoffe.includes(q);
    });
  }

  const sortiert = gefiltert.slice().sort((a,b) => a.handelsname.localeCompare(b.handelsname, 'de'));

  const rows = sortiert.map(p => {
    const katalog = katalogEintrag(p.kennr);
    const kulturen = p._kulturen.join(', ') || '–';
    const wirkstoffe = [...new Set(katalog.map(k => k.wirkstoffe).filter(Boolean))].join(', ');
    const abgelaufen = katalog.some(k => istAbgelaufen(k.zul_ende));
    const leer = Math.abs(p.gesamt) <= 0.0001;
    return `
      <div class="row" data-open-produkt="${escapeHtml(p.kennr)}" ${leer ? 'style="opacity:.55"' : ''}>
        <div>
          <div class="name">${escapeHtml(p.handelsname || p.kennr)}</div>
          <div class="sub">${escapeHtml(kulturen)}</div>
          ${wirkstoffe ? `<div class="sub" style="color:var(--red)">${escapeHtml(wirkstoffe)}</div>` : ''}
        </div>
        <div style="text-align:right">
          <div class="amount">${leer ? 'nicht auf Lager' : formatZahl(p.gesamt) + ' ' + escapeHtml(p.einheit || '')}</div>
          ${abgelaufen ? '<span class="badge warn">Zulassung abgelaufen</span>' : ''}
        </div>
      </div>`;
  }).join('') || `<div class="empty">${q || bestandKulturFilter ? 'Kein Bestand für diese Auswahl.' : 'Kein Bestand vorhanden.'}</div>`;

  return `<h2>Aktueller Lagerbestand</h2>${rows}`;
}

/** Bindet die Klick-Handler für die Produktdetail-Navigation innerhalb der Bestandsliste
 *  neu – nötig nach einem gezielten innerHTML-Update der Liste (siehe renderBestandListe),
 *  da dieser Weg attachHandlers() bewusst umgeht. */
function bindBestandListeClicks(){
  document.querySelectorAll('#bestandListe [data-open-produkt]').forEach(el => {
    el.onclick = () => { state.detailKennr = el.dataset.openProdukt; setView('produkt'); };
  });
}

/* ---------- PRODUKTDETAIL ---------- */
function renderProduktDetail(kennr){
  const katalog = katalogEintrag(kennr);
  const istManuell = kennr.startsWith('MANUELL:');
  const bestand = berechneBestand().find(p => p.kennr === kennr);
  const chargen = bestand ? Object.entries(bestand.chargen).filter(([,m]) => Math.abs(m) > 0.0001) : [];
  const produktname = katalog.length ? katalog[0].handelsname : (bestand ? bestand.handelsname : kennr);

  const kulturBloecke = katalog.length ? katalog.map(k => {
    const wartezeitTage = extrahiereWartezeitTage(k.wartezeit_rohdaten);
    const wartezeitAnzeige = wartezeitTage !== null
      ? `${wartezeitTage} Tage`
      : (k.wartezeit_rohdaten && k.wartezeit_rohdaten !== '[]' ? 'Siehe Rohdaten unten – Tage nicht eindeutig erkennbar' : '–');
    return `
    <div class="card">
      <h2>${escapeHtml(k.kultur_name)}</h2>
      ${detailFeld('Zulassungsnummer', k.kennr)}
      ${detailFeld('Wirkstoffe', k.wirkstoffe)}
      ${detailFeld('Schaderreger', k.schaderreger)}
      ${detailFeld('Aufwandmenge', (k.aufwandmenge || '–') + ' ' + (k.aufwand_einheit || ''))}
      ${detailFeld('Wassermenge', (k.wasser_von || '') + (k.wasser_bis && k.wasser_bis != k.wasser_von ? '–' + k.wasser_bis : '') + ' ' + (k.wasser_einheit || ''))}
      ${detailFeld('Wartezeit', wartezeitAnzeige)}
      ${detailFeld('Auflagen', k.auflagen || '–')}
      ${detailFeld('Zulassungsbeginn', formatDatum(k.zul_beginn))}
      ${detailFeld('Zulassungsende', formatDatum(k.zul_ende) + (istAbgelaufen(k.zul_ende) ? ' ⚠️ abgelaufen' : ''))}
    </div>`;
  }).join('') : (istManuell
    ? `<div class="card"><div class="empty">Manuell erfasstes Produkt – kein Pflanzenschutzmittel aus dem BVL-Katalog, daher keine Zulassungsdaten.</div></div>`
    : `<div class="card"><div class="empty">Keine Zulassungsdaten gefunden. Katalog evtl. noch nicht synchronisiert.</div></div>`);

  const buchungenListe = state.buchungen
    .filter(b => b.kennr === kennr)
    .slice()
    .sort((a,b) => (b.zeitstempel || '').localeCompare(a.zeitstempel || ''));

  const buchungEditing = buchungEditId ? buchungenListe.find(b => String(b.id) === String(buchungEditId)) : null;

  const buchungenRows = buchungenListe.map(b => {
    // Historische Buchungen aus der (inzwischen entfernten) Maßnahmenplanung
    // sind an massnahme_id erkennbar, ohne dass dazu noch Details vorliegen.
    const herkunft = b.typ === 'Ausbuchung'
      ? (b.massnahme_id ? 'Maßnahme (historisch)' : 'Manuelle Ausbuchung')
      : '';
    return `
    <div class="row">
      <div>
        <div class="name">${b.typ === 'Ausbuchung' ? '−' : '+'}${formatZahl(b.menge)} ${escapeHtml(b.einheit || '')}</div>
        <div class="sub">${formatDatum(b.datum)} · Charge ${escapeHtml(b.charge || '–')} · ${escapeHtml(b.person || '–')}</div>
        ${herkunft ? `<div class="sub">${escapeHtml(herkunft)}</div>` : ''}
        ${b.kommentar ? `<div class="sub">${escapeHtml(b.kommentar)}</div>` : ''}
      </div>
      <div class="btn-row" style="margin-top:0">
        <button class="btn btn-sm btn-outline" data-edit-buchung="${b.id}">Bearbeiten</button>
        <button class="btn btn-sm btn-danger" data-delete-buchung="${b.id}">Löschen</button>
      </div>
    </div>
  `;
  }).join('') || '<div class="empty">Keine Buchungen für dieses Produkt.</div>';

  const buchungEditForm = buchungEditing ? `
    <div class="card" style="background:#faf9f5">
      <h2>Buchung bearbeiten</h2>
      <label>Typ</label>
      <select id="beTyp">
        <option value="Einbuchung" ${buchungEditing.typ === 'Einbuchung' ? 'selected' : ''}>Einbuchung</option>
        <option value="Ausbuchung" ${buchungEditing.typ === 'Ausbuchung' ? 'selected' : ''}>Ausbuchung</option>
      </select>
      <label>Menge</label>
      <input type="number" id="beMenge" step="0.01" value="${buchungEditing.menge}">
      <label>Einheit</label>
      <input type="text" id="beEinheit" value="${escapeHtml(buchungEditing.einheit || '')}">
      <label>Datum</label>
      <input type="date" id="beDatum" value="${(buchungEditing.datum || '').slice(0,10)}">
      <label>Chargennummer</label>
      <input type="text" id="beCharge" value="${escapeHtml(buchungEditing.charge || '')}">
      <label>Person</label>
      <input type="text" id="bePerson" value="${escapeHtml(buchungEditing.person || '')}">
      <label>Kommentar / Grund</label>
      <input type="text" id="beKommentar" value="${escapeHtml(buchungEditing.kommentar || '')}">
      <div class="btn-row">
        <button class="btn btn-primary" id="beSpeichern" data-id="${buchungEditing.id}">Änderungen speichern</button>
        <button class="btn btn-outline" id="beAbbrechen">Abbrechen</button>
      </div>
    </div>
  ` : '';

  return `
    <a class="back-link" data-view-link="start">← Zurück zum Bestand</a>
    <div class="card">
      <h2>${escapeHtml(produktname)}</h2>
      ${detailFeld('Aktueller Bestand', bestand ? formatZahl(bestand.gesamt) + ' ' + (bestand.einheit || '') : '0')}
      ${chargen.length ? `<div class="detail-field"><div class="k">Nach Charge</div>` +
        chargen.map(([c,m]) => `<div class="v">${escapeHtml(c)}: ${formatZahl(m)} ${escapeHtml(bestand.einheit || '')}</div>`).join('') + `</div>` : ''}
    </div>
    <div class="card"><h2>Buchungshistorie</h2>${buchungenRows}</div>
    ${buchungEditForm}
    ${kulturBloecke}
  `;
}

function detailFeld(label, wert){
  return `<div class="detail-field"><div class="k">${escapeHtml(label)}</div><div class="v">${escapeHtml(String(wert || '–'))}</div></div>`;
}

/* ---------- BUCHEN ---------- */

        <input type="hidden" id="einKennr" value="${escapeHtml(einbuchenDraft.kennr)}">
        <input type="hidden" id="einHandelsname" value="${escapeHtml(einbuchenDraft.handelsname)}">

      <label>Menge</label>

        <option ${einbuchenDraft.einheit === 'ml' ? 'selected' : ''}>ml</option>
        <option ${einbuchenDraft.einheit === 'kg' ? 'selected' : ''}>kg</option>

      <input type="text" id="einPerson" placeholder="Dein Name" value="${escapeHtml(einbuchenDraft.person)}">

    <div class="card">

      <label>Menge</label>
      <input type="number" id="ausMenge" step="0.01" value="${ausbuchenDraft.menge}">

function bestandOptionen(){
  const bestand = berechneBestand();
  return bestand.map(p => `<option value="${p.kennr}" ${ausbuchenDraft.kennr === p.kennr ? 'selected' : ''}>${escapeHtml(p.handelsname)} (${formatZahl(p.gesamt)} ${escapeHtml(p.einheit || '')})</option>`).join('');
}

/* ---------- HISTORIE: alle Buchungen chronologisch ---------- */
function renderHistorie(){
  return `
    <div class="card">
      <label>Nach Produktname filtern</label>
      <input type="text" id="historieFilter" placeholder="Produktname…" value="${escapeHtml(historieFilter)}">
    </div>
    <div class="card" id="historieListe">${renderHistorieListe()}</div>
  `;
}

/** Erzeugt nur die Listen-Zeilen der Historie (ohne Filter-Card), damit beim Tippen
 *  im Filterfeld nicht die ganze Seite (inkl. Eingabefeld) neu gezeichnet werden muss –
 *  das würde sonst wie beim Datumsfeld-Bug den Fokus/die Cursor-Position zerstören. */
function renderHistorieListe(){
  const q = historieFilter.trim().toLowerCase();
  const alle = state.buchungen
    .filter(b => !q || (b.handelsname || '').toLowerCase().includes(q))
    .slice()
    .sort((a,b) => (b.zeitstempel || '').localeCompare(a.zeitstempel || ''));

  const rows = alle.map(b => {
    const herkunft = b.typ === 'Ausbuchung'
      ? (b.massnahme_id ? 'Maßnahme (historisch)' : 'Manuelle Ausbuchung')
      : '';
    return `
      <div class="row" data-open-produkt="${escapeHtml(b.kennr)}" style="cursor:pointer">
        <div>
          <div class="name">${escapeHtml(b.handelsname || b.kennr)}</div>
          <div class="sub">${formatDatum(b.datum)} · Charge ${escapeHtml(b.charge || '–')} · ${escapeHtml(b.person || '–')}</div>
          ${herkunft ? `<div class="sub">${escapeHtml(herkunft)}</div>` : ''}
          ${b.kommentar ? `<div class="sub">${escapeHtml(b.kommentar)}</div>` : ''}
        </div>
        <div class="amount" style="color:${b.typ === 'Ausbuchung' ? 'var(--red)' : 'var(--green-dark)'}">${b.typ === 'Ausbuchung' ? '−' : '+'}${formatZahl(b.menge)} ${escapeHtml(b.einheit || '')}</div>
      </div>`;
  }).join('') || `<div class="empty">${q ? 'Keine Buchungen für diesen Filter.' : 'Noch keine Buchungen vorhanden.'}</div>`;

  return `<h2>Buchungshistorie (${alle.length})</h2>${rows}`;
}

/** Bindet die Klick-Handler für die Produktdetail-Navigation innerhalb der Historie-Liste
 *  neu – nötig nach einem gezielten innerHTML-Update der Liste (siehe renderHistorieListe),
 *  da dieser Weg attachHandlers() bewusst umgeht, um das Filterfeld nicht neu zu zeichnen. */
function bindHistorieRowClicks(){
  document.querySelectorAll('#historieListe [data-open-produkt]').forEach(el => {
    el.onclick = () => { state.detailKennr = el.dataset.openProdukt; setView('produkt'); };
  });
}

/* ============================================================
   EVENT HANDLER
   ============================================================ */
function attachHandlers(){
  document.querySelectorAll('nav.bottom button').forEach(btn => {
    btn.onclick = () => { setView(btn.dataset.view); };
  });

  document.querySelectorAll('[data-view-link]').forEach(el => {
    el.onclick = (e) => { e.preventDefault(); setView(el.dataset.viewLink); };
  });

  document.querySelectorAll('[data-open-produkt]').forEach(el => {
    el.onclick = () => { state.detailKennr = el.dataset.openProdukt; setView('produkt'); };
  });

  const bestandKulturFilterEl = document.getElementById('bestandKulturFilter');
  if (bestandKulturFilterEl){
    bestandKulturFilterEl.onchange = () => { bestandKulturFilter = bestandKulturFilterEl.value; render(); };
  }
  const bestandSucheEl = document.getElementById('bestandSuche');
  if (bestandSucheEl){
    bestandSucheEl.oninput = () => {
      bestandSuche = bestandSucheEl.value;
      // Nur die Listen-Card aktualisieren, nicht render() aufrufen – sonst verliert das
      // Suchfeld beim Tippen den Fokus (gleiches Prinzip wie bei der Historie).
      document.getElementById('bestandListe').innerHTML = renderBestandListe();
      bindBestandListeClicks();
    };
  }
  const exportTyp = document.getElementById('exportTyp');
  if (exportTyp) exportTyp.onchange = () => { exportDraft.typ = exportTyp.value; render(); };
  const exportVon = document.getElementById('exportVon');
  if (exportVon){ exportVon.oninput = () => { exportDraft.von = exportVon.value; }; }
  const exportBis = document.getElementById('exportBis');
  if (exportBis){ exportBis.oninput = () => { exportDraft.bis = exportBis.value; }; }
  const exportFormat = document.getElementById('exportFormat');
  if (exportFormat) exportFormat.onchange = () => { exportDraft.format = exportFormat.value; };
  const exportBuchungenBtn = document.getElementById('exportBuchungenBtn');
  if (exportBuchungenBtn) exportBuchungenBtn.onclick = () => {
    if (exportDraft.typ === 'bestand'){
      if (exportDraft.format === 'pdf') druckansichtBestand(); else exportiereBestandCsv();
    } else {
      if (exportDraft.format === 'pdf') druckansichtBuchungen(exportDraft.von, exportDraft.bis); else exportiereBuchungenCsv(exportDraft.von, exportDraft.bis);
    }
  };

  // ---- Historie ----
  const historieFilterEl = document.getElementById('historieFilter');
  if (historieFilterEl){
    historieFilterEl.oninput = () => {
      historieFilter = historieFilterEl.value;
      // Nur die Listen-Card aktualisieren, nicht render() aufrufen – sonst verliert das
      // Filterfeld beim Tippen den Fokus (gleiches Problem wie beim Datumsfeld).
      document.getElementById('historieListe').innerHTML = renderHistorieListe();
      bindHistorieRowClicks();
    };
  }

  // ---- Produktdetail: Buchungen bearbeiten/löschen ----
  document.querySelectorAll('[data-edit-buchung]').forEach(el => {
    el.onclick = () => { buchungEditId = el.dataset.editBuchung; render(); };
  });
  document.querySelectorAll('[data-delete-buchung]').forEach(el => {
    el.onclick = () => handleBuchungLoeschen(el.dataset.deleteBuchung);
  });
  const beAbbrechen = document.getElementById('beAbbrechen');
  if (beAbbrechen) beAbbrechen.onclick = () => { buchungEditId = null; render(); };
  const beSpeichern = document.getElementById('beSpeichern');
  if (beSpeichern) beSpeichern.onclick = () => handleBuchungSpeichern(beSpeichern.dataset.id);

  // ---- Buchen ----
  const einManuellModus = document.getElementById('einManuellModus');
  if (einManuellModus){
    einManuellModus.onchange = () => { einbuchenDraft.manuell = einManuellModus.checked; render(); };
  }
  const einManuellName = document.getElementById('einManuellName');
  if (einManuellName){ einManuellName.oninput = () => { einbuchenDraft.manuellName = einManuellName.value; }; }
  const einManuellAuswahl = document.getElementById('einManuellAuswahl');
  if (einManuellAuswahl){
    einManuellAuswahl.onchange = () => {
      if (!einManuellAuswahl.value) return;
      einbuchenDraft.manuellName = einManuellAuswahl.value;
      render();
    };
  }

  const einSuche = document.getElementById('einSuche');
  if (einSuche){
    einSuche.oninput = () => {
      einbuchenDraft.suche = einSuche.value;
      renderSuchergebnisse(einSuche.value, 'einErgebnisse', (item) => {
        einbuchenDraft.kennr = item.kennr;
        einbuchenDraft.handelsname = item.handelsname;
        einbuchenDraft.suche = item.handelsname;
        document.getElementById('einKennr').value = item.kennr;
        document.getElementById('einHandelsname').value = item.handelsname;
        einSuche.value = item.handelsname;
        document.getElementById('einErgebnisse').classList.add('hidden');
      });
    };
  }
  const einSpeichern = document.getElementById('einSpeichern');
  if (einSpeichern) einSpeichern.onclick = handleEinbuchen;
  const einChargeScan = document.getElementById('einChargeScan');
  if (einChargeScan) einChargeScan.onclick = () => starteBarcodeScan((code) => {
    einbuchenDraft.charge = code;
    render();
  });
  const einMenge = document.getElementById('einMenge');
  if (einMenge){ einMenge.oninput = () => { einbuchenDraft.menge = einMenge.value; }; }
  const einEinheit = document.getElementById('einEinheit');
  if (einEinheit){ einEinheit.onchange = () => { einbuchenDraft.einheit = einEinheit.value; }; }
  const einDatum = document.getElementById('einDatum');
  if (einDatum){ einDatum.oninput = () => { einbuchenDraft.datum = einDatum.value; }; }
  const einCharge = document.getElementById('einCharge');
  if (einCharge){ einCharge.oninput = () => { einbuchenDraft.charge = einCharge.value; }; }
  const einWeitereChargeBtn = document.getElementById('einWeitereChargeBtn');
  if (einWeitereChargeBtn) einWeitereChargeBtn.onclick = () => {
    einbuchenDraft.weitereChargen.push({ charge: '', menge: '' });
    render();
  };
  document.querySelectorAll('[data-weitere-charge-index]').forEach(el => {
    el.oninput = () => { einbuchenDraft.weitereChargen[el.dataset.weitereChargeIndex].charge = el.value; };
  });
  document.querySelectorAll('[data-weitere-menge-index]').forEach(el => {
    el.oninput = () => { einbuchenDraft.weitereChargen[el.dataset.weitereMengeIndex].menge = el.value; };
  });
  document.querySelectorAll('[data-remove-weitere-charge]').forEach(el => {
    el.onclick = () => { einbuchenDraft.weitereChargen.splice(el.dataset.removeWeitereCharge, 1); render(); };
  });
  document.querySelectorAll('[data-schnellwahl-kennr]').forEach(el => {
    el.onclick = () => {
      einbuchenDraft.kennr = el.dataset.schnellwahlKennr;
      einbuchenDraft.handelsname = el.dataset.schnellwahlName;
      einbuchenDraft.suche = el.dataset.schnellwahlName;
      render();
    };
  });
  const einPerson = document.getElementById('einPerson');
  if (einPerson){ einPerson.oninput = () => { einbuchenDraft.person = einPerson.value; }; }

  const ausProdukt = document.getElementById('ausProdukt');
  if (ausProdukt){ ausProdukt.onchange = updateAusChargen; }
  const ausCharge = document.getElementById('ausCharge');
  if (ausCharge){ ausCharge.onchange = () => { ausbuchenDraft.charge = ausCharge.value; }; }
  const ausSpeichern = document.getElementById('ausSpeichern');
  if (ausSpeichern) ausSpeichern.onclick = handleAusbuchen;
  const ausMenge = document.getElementById('ausMenge');
  if (ausMenge){ ausMenge.oninput = () => { ausbuchenDraft.menge = ausMenge.value; }; }
  const ausDatum = document.getElementById('ausDatum');
  if (ausDatum){ ausDatum.oninput = () => { ausbuchenDraft.datum = ausDatum.value; }; }
  const ausPerson = document.getElementById('ausPerson');
  if (ausPerson){ ausPerson.oninput = () => { ausbuchenDraft.person = ausPerson.value; }; }
  const ausKommentar = document.getElementById('ausKommentar');
  if (ausKommentar){ ausKommentar.oninput = () => { ausbuchenDraft.kommentar = ausKommentar.value; }; }

}


function setView(view){
  state.view = view;
  document.querySelectorAll('nav.bottom button').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  if (['start','buchen','historie','produkt'].includes(view) && !state.katalogLoaded){
    loadKatalogOnce();
  }
  render();
}

function renderSuchergebnisse(query, containerId, onSelect){
  const container = document.getElementById(containerId);
  if (!query || query.length < 2){ container.classList.add('hidden'); container.innerHTML=''; return; }
  const q = query.toLowerCase();
  const treffer = [];
  const seen = new Set();
  state.katalog.forEach(k => {
    const nameTreffer = k.handelsname && k.handelsname.toLowerCase().includes(q);
    const wirkstoffTreffer = k.wirkstoffe && k.wirkstoffe.toLowerCase().includes(q);
    if ((nameTreffer || wirkstoffTreffer) && !seen.has(k.kennr)){
      seen.add(k.kennr);
      treffer.push(k);
    }
  });
  if (treffer.length === 0){
    container.innerHTML = `<div>Keine Treffer im Katalog.</div>`;
    container.classList.remove('hidden');
    return;
  }
  const bestand = berechneBestand();
  container.innerHTML = treffer.slice(0, 20).map(k => {
    const b = bestand.find(p => p.kennr === k.kennr);
    const bestandText = b ? `${formatZahl(b.gesamt)} ${escapeHtml(b.einheit || '')} im Bestand` : '0 im Bestand';
    return `<div data-kennr="${k.kennr}">${escapeHtml(k.handelsname)}<small>${escapeHtml(k.kultur_name || '')} · ${escapeHtml(bestandText)}${k.wirkstoffe ? ' · ' + escapeHtml(k.wirkstoffe) : ''}</small></div>`;
  }).join('');
  container.classList.remove('hidden');
  container.querySelectorAll('div[data-kennr]').forEach(el => {
    el.onclick = () => {
      const item = treffer.find(t => t.kennr === el.dataset.kennr);
      onSelect(item);
    };
  });
}

/* ---- Aktionen ---- */
/** Erzeugt aus einem manuell eingegebenen Produktnamen einen stabilen Schlüssel,
 *  damit spätere Buchungen desselben Produkts im selben Bestand landen. */
function manuelleKennr(name){
  return 'MANUELL:' + name.trim().toLowerCase().replace(/\s+/g, ' ');
}

/** Die zuletzt verwendeten BVL-Mittel (nach Zeitstempel der Buchung, dedupliziert), für Schnellzugriff beim Einbuchen. */
function letzteVerwendeteMittel(limit){
  limit = limit || 6;
  const gesehen = new Set();
  const ergebnis = [];
  state.buchungen
    .filter(b => b.kennr && !b.kennr.startsWith('MANUELL:'))
    .slice()
    .sort((a,b) => (b.zeitstempel || '').localeCompare(a.zeitstempel || ''))
    .forEach(b => {
      if (!gesehen.has(b.kennr) && ergebnis.length < limit){
        gesehen.add(b.kennr);
        ergebnis.push({ kennr: b.kennr, handelsname: b.handelsname });
      }
    });
  return ergebnis;
}

/** Alle bisher manuell erfassten Produkte (auch mit Bestand 0, für Nachbestellungen), dedupliziert. */
function manuelleProdukteListe(){
  const gesehen = new Set();
  const ergebnis = [];
  state.buchungen
    .filter(b => (b.kennr || '').startsWith('MANUELL:'))
    .forEach(b => {
      if (!gesehen.has(b.kennr)){
        gesehen.add(b.kennr);
        ergebnis.push({ kennr: b.kennr, handelsname: b.handelsname });
      }
    });
  return ergebnis.sort((a,b) => a.handelsname.localeCompare(b.handelsname, 'de'));
}

async function handleEinbuchen(){
  if (buchungWirdGespeichert) return; // Doppelklick/Doppel-Tap: zweiten Aufruf ignorieren
  let kennr, handelsname;
  if (einbuchenDraft.manuell){
    handelsname = document.getElementById('einManuellName').value.trim();
    if (!handelsname){ toast('Bitte Produktnamen eingeben.'); return; }
    kennr = manuelleKennr(handelsname);
  } else {
    kennr = document.getElementById('einKennr').value;
    handelsname = document.getElementById('einHandelsname').value;
  }
  const menge = document.getElementById('einMenge').value;
  if (!kennr || !menge){ toast('Bitte Produkt und Menge angeben.'); return; }

  // Weitere Chargen derselben Lieferung müssen vollständig ausgefüllt sein
  const weitereUnvollstaendig = einbuchenDraft.weitereChargen.some(wc => !wc.charge || !wc.menge);
  if (weitereUnvollstaendig){ toast('Bitte bei jeder weiteren Charge Chargennummer und Menge angeben (oder die Zeile entfernen).'); return; }

  const einheit = document.getElementById('einEinheit').value;
  const datum = document.getElementById('einDatum').value;
  const person = document.getElementById('einPerson').value;

  // Konsistenzprüfung: der Bestand wird pro Produkt einfach aufsummiert, unabhängig
  // von der Einheit. Eine abweichende Einheit bei derselben kennr würde die Summe
  // stillschweigend verfälschen (z.B. 5 l + 500 "Stück" = 505) - das lieber verhindern.
  const bestehenderBestand = berechneBestand(true).find(p => p.kennr === kennr);
  if (bestehenderBestand && bestehenderBestand.einheit && bestehenderBestand.einheit !== einheit){
    toast(`Dieses Produkt ist bisher in "${bestehenderBestand.einheit}" gebucht, nicht in "${einheit}". Bitte Einheit angleichen, sonst wird der Bestand falsch berechnet.`);
    return;
  }

  const alleChargen = [
    { charge: document.getElementById('einCharge').value, menge },
    ...einbuchenDraft.weitereChargen
  ];

  buchungWirdGespeichert = true;
  const btn = document.getElementById('einSpeichern');
  if (btn){ btn.disabled = true; btn.textContent = 'Speichert…'; }
  try{
    for (const eintrag of alleChargen){
      await apiPost('addBuchung', {
        kennr, handelsname, typ: 'Einbuchung', menge: eintrag.menge,
        einheit, datum, charge: eintrag.charge, person,
        clientRequestId: neueClientRequestId()
      });
      // Nach jedem erfolgreichen Schritt sofort aus der Warteliste entfernen, damit ein
      // Klick auf "Einbuchen" nach einem Teilfehler nicht bereits Gebuchtes wiederholt.
      if (eintrag === alleChargen[0]){
        einbuchenDraft.charge = ''; einbuchenDraft.menge = '';
      } else {
        einbuchenDraft.weitereChargen = einbuchenDraft.weitereChargen.filter(wc => wc !== eintrag);
      }
    }
    toast(alleChargen.length > 1 ? `${alleChargen.length} Chargen eingebucht.` : 'Eingebucht.');
    // Produkt zurücksetzen, Datum + Person für die nächste Buchung behalten
    einbuchenDraft.suche = ''; einbuchenDraft.kennr = ''; einbuchenDraft.handelsname = '';
    einbuchenDraft.manuellName = '';
    await syncOperativeData(false);
    render();
  }catch(err){
    toast('Fehler: ' + err.message);
    if (btn){ btn.disabled = false; btn.textContent = 'Einbuchen'; }
  }
  finally{ buchungWirdGespeichert = false; }
}

    .map(([c,m]) => `<option value="${escapeHtml(c)}" ${selectedCharge === c ? 'selected' : ''}>${escapeHtml(c)} (${formatZahl(m)} ${escapeHtml(bestand.einheit || '')} verfügbar)</option>`).join('');
  return '<option value="">– wählen –</option>' + optionen;

/* ============================================================
   UTIL
   ============================================================ */
function escapeHtml(str){
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatZahl(n){
  const num = parseFloat(n);
  if (isNaN(num)) return '0';
  return num.toLocaleString('de-DE', { maximumFractionDigits: 2 });
}
function formatDatum(iso){
  if (!iso) return '–';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso);
  return d.toLocaleDateString('de-DE');
}
function heute(){
  return new Date().toISOString().slice(0,10);
}

/* ============================================================
   BARCODE-SCANNER (für Chargennummer)
   ============================================================ */
let scannerStream = null;
let scannerLaeuft = false;

/**
 * Öffnet die Kamera und versucht, einen Barcode/QR-Code zu erkennen. Nutzt die
 * native BarcodeDetector-API des Browsers (verfügbar z.B. in Chrome/Edge auf
 * Android und Desktop). Safari/iOS unterstützt diese API bisher nicht – dort
 * erscheint stattdessen ein Hinweis, die Chargennummer manuell einzutippen.
 */
async function starteBarcodeScan(onErkannt){
  if (!('BarcodeDetector' in window)){
    toast('Dein Browser unterstützt keine Barcode-Erkennung. Bitte Chargennummer manuell eingeben.');
    return;
  }
  const overlay = document.getElementById('scannerOverlay');
  const video = document.getElementById('scannerVideo');
  try{
    scannerStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  }catch(err){
    toast('Kein Kamerazugriff möglich: ' + err.message);
    return;
  }
  video.srcObject = scannerStream;
  overlay.classList.remove('hidden');
  scannerLaeuft = true;

  const detector = new BarcodeDetector({ formats: ['code_128', 'code_39', 'ean_13', 'ean_8', 'qr_code'] });

  const suchschleife = async () => {
    if (!scannerLaeuft) return;
    try{
      const treffer = await detector.detect(video);
      if (treffer.length > 0){
        const code = treffer[0].rawValue;
        beendeBarcodeScan();
        onErkannt(code);
        return;
      }
    }catch(err){ /* einzelner Frame fehlgeschlagen, einfach weiter versuchen */ }
    if (scannerLaeuft) requestAnimationFrame(suchschleife);
  };
  suchschleife();
}

function beendeBarcodeScan(){
  scannerLaeuft = false;
  if (scannerStream){
    scannerStream.getTracks().forEach(track => track.stop());
    scannerStream = null;
  }
  document.getElementById('scannerOverlay').classList.add('hidden');
}

document.getElementById('scannerAbbrechen').onclick = beendeBarcodeScan;

/** Exportiert alle Buchungen als CSV-Datei (deutsches Format: Semikolon-getrennt,
 *  UTF-8 mit BOM für korrekte Umlaute in Excel). Für Kontrollen/Ackerschlagdatei. */
function exportiereBuchungenCsv(von, bis){
  const header = ['Datum', 'Handelsname', 'Typ', 'Menge', 'Einheit', 'Charge', 'Person', 'Kommentar'];
  const zeilen = state.buchungen
    .filter(b => (!von || (b.datum || '') >= von) && (!bis || (b.datum || '') <= bis))
    .slice()
    .sort((a,b) => (a.datum || '').localeCompare(b.datum || ''))
    .map(b => [b.datum || '', b.handelsname || '', b.typ || '', b.menge, b.einheit || '', b.charge || '', b.person || '', b.kommentar || '']);

  if (zeilen.length === 0){ toast('Keine Buchungen im gewählten Zeitraum.'); return; }

  const csvZeile = row => row.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(';');
  const csv = [csvZeile(header), ...zeilen.map(csvZeile)].join('\r\n');
  const dateiname = 'psm-buchungen' + (von || bis ? `_${von || 'anfang'}_bis_${bis || 'heute'}` : '') + '.csv';
  ladeCsvHerunter(csv, dateiname);
}

/** Exportiert eine Momentaufnahme des aktuellen Lagerbestands (inkl. Produkte mit 0 Bestand). */
function exportiereBestandCsv(){
  const header = ['Handelsname', 'Kultur(en)', 'Wirkstoffe', 'Menge', 'Einheit', 'Status'];
  const bestand = berechneBestand(true);
  const zeilen = bestand
    .slice()
    .sort((a,b) => a.handelsname.localeCompare(b.handelsname, 'de'))
    .map(p => {
      const katalog = katalogEintrag(p.kennr);
      const kulturen = [...new Set(katalog.map(k => k.kultur_name).filter(Boolean))].join(', ');
      const wirkstoffe = [...new Set(katalog.map(k => k.wirkstoffe).filter(Boolean))].join(', ');
      const leer = Math.abs(p.gesamt) <= 0.0001;
      return [p.handelsname || p.kennr, kulturen, wirkstoffe, leer ? 0 : p.gesamt, p.einheit || '', leer ? 'nicht auf Lager' : 'auf Lager'];
    });

  if (zeilen.length === 0){ toast('Kein Bestand vorhanden.'); return; }

  const csvZeile = row => row.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(';');
  const csv = [csvZeile(header), ...zeilen.map(csvZeile)].join('\r\n');
  ladeCsvHerunter(csv, 'psm-bestand_' + heute() + '.csv');
}

function ladeCsvHerunter(csv, dateiname){
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = dateiname;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/**
 * Öffnet ein neues Fenster mit einer druckfreundlichen Tabelle und startet den
 * Browser-Druckdialog. Dort kann als Ziel-Drucker "Als PDF speichern" (Windows/Chrome)
 * bzw. "In Dateien sichern" / "Print to PDF" (Mac/iOS/Android) gewählt werden – so
 * entsteht ein PDF ohne dass die App selbst eine PDF-Bibliothek mitbringen muss.
 */
function oeffneDruckansicht(titel, spalten, zeilen){
  const fenster = window.open('', '_blank');
  if (!fenster){ toast('Popup wurde vom Browser blockiert – bitte Popups für diese Seite erlauben.'); return; }
  const tabelleHtml = `
    <table>
      <thead><tr>${spalten.map(s => `<th>${escapeHtml(s)}</th>`).join('')}</tr></thead>
      <tbody>${zeilen.map(z => `<tr>${z.map(v => `<td>${escapeHtml(String(v == null ? '' : v))}</td>`).join('')}</tr>`).join('')}</tbody>
    </table>
  `;
  fenster.document.write(`
    <!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><title>${escapeHtml(titel)}</title>
    <style>
      body{font-family:Arial,sans-serif;padding:20px;color:#222}
      h1{font-size:18px;margin-bottom:4px}
      .datum{color:#666;font-size:12px;margin-bottom:16px}
      table{width:100%;border-collapse:collapse;font-size:12px}
      th,td{border:1px solid #ccc;padding:6px 8px;text-align:left}
      th{background:#f0f0f0}
      @media print{ body{padding:0} }
    </style></head>
    <body>
      <h1>${escapeHtml(titel)}</h1>
      <div class="datum">Erstellt am ${new Date().toLocaleDateString('de-DE')} ${new Date().toLocaleTimeString('de-DE')}</div>
      ${tabelleHtml}
      <script>window.onload = () => window.print();<\/script>
    </body></html>
  `);
  fenster.document.close();
}

    .map(b => [formatDatum(b.datum), b.handelsname || '', b.typ || '', formatZahl(b.menge), b.einheit || '', b.charge || '', b.person || '', b.kommentar || '']);

  const titel = 'PSM-Buchungen' + (von || bis ? ` (${von || 'Anfang'} bis ${bis || 'heute'})` : ' (alle)');
  oeffneDruckansicht(titel, ['Datum', 'Handelsname', 'Typ', 'Menge', 'Einheit', 'Charge', 'Person', 'Kommentar'], zeilen);

function druckansichtBestand(){
  const bestand = berechneBestand(true);
  const zeilen = bestand
    .slice()
    .sort((a,b) => a.handelsname.localeCompare(b.handelsname, 'de'))
    .map(p => {
      const katalog = katalogEintrag(p.kennr);
      const kulturen = [...new Set(katalog.map(k => k.kultur_name).filter(Boolean))].join(', ');
      const wirkstoffe = [...new Set(katalog.map(k => k.wirkstoffe).filter(Boolean))].join(', ');
      const leer = Math.abs(p.gesamt) <= 0.0001;
      return [p.handelsname || p.kennr, kulturen, wirkstoffe, leer ? '0' : formatZahl(p.gesamt), p.einheit || '', leer ? 'nicht auf Lager' : 'auf Lager'];

async function init(){
  if (APP_SCRIPT_URL.includes('HIER_DEINE')){
    document.getElementById('main').innerHTML = '<div class="card"><div class="empty">Bitte zuerst APP_SCRIPT_URL im Code eintragen (siehe SETUP.md).</div></div>';
    return;
  }
  // Buchungen (Bestand) und Katalog sind voneinander unabhängig – parallel laden
  // statt nacheinander, das halbiert effektiv die Wartezeit beim Seitenaufbau.
  await Promise.all([ syncOperativeData(false), loadKatalogOnce() ]);
  setInterval(() => syncOperativeData(false, true), SYNC_INTERVAL_MS);
}
init();
