<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PSM-Bestandsbuch</title>
<style>
  :root{
    --bg:#f5f3ed;
    --card:#ffffff;
    --line:#e2ddd0;
    --ink:#20241f;
    --ink-soft:#5b6058;
    --green:#2b4735;
    --green-dark:#1c3024;
    --amber:#c98a2e;
    --amber-soft:#f4e2c4;
    --red:#b3261e;
    --red-soft:#f6dcda;
    --radius:14px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{padding-top:calc(var(--safe-top) + 8px);padding-bottom:calc(64px + var(--safe-bottom) + 12px);
    min-height:100vh;}
  input,select,button,textarea{font-size:16px;font-family:inherit;} /* verhindert iOS-Zoom bei Fokus */

  header.top{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;
    padding:calc(var(--safe-top) + 10px) 16px 12px;display:flex;align-items:center;justify-content:space-between;}
  header.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;}
  header.top .sync-btn{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:10px;
    padding:8px 12px;font-size:13px;display:flex;align-items:center;gap:6px;}
  header.top .sync-dot{width:8px;height:8px;border-radius:50%;background:#8fd19e;}
  header.top .sync-dot.warn{background:var(--amber);}

  main{padding:12px 14px;max-width:640px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:12px;}
  .card h2{font-size:15px;margin:0 0 10px;color:var(--green-dark);}
  .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;
    border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .row .name{font-weight:600;font-size:15px;}
  .row .sub{color:var(--ink-soft);font-size:13px;margin-top:2px;}
  .amount{font-weight:700;font-size:16px;}
  .badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;}
  .badge.warn{background:var(--red-soft);color:var(--red);}
  .badge.ok{background:#e0ece3;color:var(--green-dark);}
  .badge.pending{background:var(--amber-soft);color:#8a5a12;}

  label{display:block;font-size:13px;color:var(--ink-soft);margin:10px 0 4px;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;padding:12px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);}
  textarea{resize:vertical;min-height:60px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:13px 16px;border-radius:12px;border:none;font-weight:700;font-size:15px;width:100%;
    min-height:48px;}
  .btn-primary{background:var(--green);color:#fff;}
  .btn-amber{background:var(--amber);color:#fff;}
  .btn-outline{background:transparent;border:1.5px solid var(--green);color:var(--green);}
  .btn-danger{background:var(--red);color:#fff;}
  .btn-sm{padding:9px 12px;font-size:13px;width:auto;min-height:40px;}
  .btn-row{display:flex;gap:8px;margin-top:10px;}
  .btn-row .btn{flex:1;}

  .searchbox{position:relative;}
  .search-results{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);
    border-top:none;border-radius:0 0 10px 10px;max-height:260px;overflow-y:auto;z-index:10;}
  .search-results div{padding:11px 12px;border-bottom:1px solid var(--line);font-size:14px;}
  .search-results div small{display:block;color:var(--ink-soft);}

  nav.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
    display:flex;padding-bottom:var(--safe-bottom);z-index:6;}
  nav.bottom button{flex:1;background:none;border:none;padding:8px 2px 8px;color:var(--ink-soft);
    font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15;}
  nav.bottom button.active{color:var(--green);font-weight:700;}
  nav.bottom .icon{font-size:18px;}

  .empty{text-align:center;color:var(--ink-soft);padding:24px 10px;font-size:14px;}
  .hidden{display:none !important;}
  .produkt-line{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:8px;}
  .produkt-line .grow{flex:1 1 100%;min-width:160px;}
  .produkt-line .aufwand{width:110px;}
  .flaeche-check{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);}
  .flaeche-check:last-child{border-bottom:none;}
  .flaeche-check input{width:auto;}
  .result-box{background:var(--amber-soft);border-radius:10px;padding:12px;margin-top:10px;font-size:14px;}
  .result-box b{display:block;margin-bottom:4px;}
  .toast{position:fixed;bottom:calc(76px + var(--safe-bottom));left:16px;right:16px;background:var(--green-dark);
    color:#fff;padding:12px 16px;border-radius:12px;text-align:center;font-size:14px;z-index:20;
    opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;
    align-items:flex-end;justify-content:center;}
  .modal-box{background:var(--card);border-radius:16px 16px 0 0;padding:16px;width:100%;max-width:640px;
    max-height:85vh;overflow-y:auto;padding-bottom:calc(20px + var(--safe-bottom));}
  .modal-box h2{font-size:16px;margin:0 0 10px;color:var(--green-dark);}
  .toast.show{opacity:1;transform:translateY(0);}
  .detail-field{margin-bottom:10px;}
  .detail-field .k{font-size:12px;color:var(--ink-soft);}
  .detail-field .v{font-size:14px;}
  .back-link{color:var(--green);font-size:14px;margin-bottom:10px;display:inline-block;}
</style>
</head>
<body>

<header class="top">
  <h1>🌾 PSM-Bestandsbuch</h1>
  <button class="sync-btn" id="syncBtn"><span class="sync-dot" id="syncDot"></span><span id="syncLabel">Sync</span></button>
</header>

<main id="main"></main>

<nav class="bottom">
  <button data-view="start" class="active"><span class="icon">🏠</span>Offene Arbeiten</button>
  <button data-view="bestand"><span class="icon">📦</span>PSM Bestand</button>
  <button data-view="buchen"><span class="icon">✍️</span>PSM Buchen</button>
  <button data-view="arbeiten"><span class="icon">🚜</span>Arbeitsplanung</button>
  <button data-view="mehr"><span class="icon">☰</span>Mehr</button>
</nav>

<div class="toast" id="toast"></div>

<div id="flaecheModalOverlay" class="modal-overlay hidden">
  <div class="modal-box" id="flaecheModalBox"></div>
</div>

<div id="scannerOverlay" class="hidden" style="position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column">
  <video id="scannerVideo" autoplay playsinline style="flex:1;width:100%;object-fit:cover"></video>
  <div style="padding:16px;background:#000;padding-bottom:calc(16px + var(--safe-bottom))">
    <button class="btn btn-outline" id="scannerAbbrechen" style="border-color:#fff;color:#fff">Abbrechen</button>
  </div>
</div>

<script>
/* ============================================================
   KONFIGURATION – hier die Web-App-URL deines Apps Scripts eintragen
   ============================================================ */
const APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyM9cTcewhFnXRuwF2dVtUXaglPnnEyPd1khHX9WH0qFcYxLpo_CKEOZuU0XCUxd6m6/exec';
const SYNC_INTERVAL_MS = 22000;
const KULTUREN = ['Gerste', 'Weizen', 'Roggen', 'Triticale', 'Raps', 'Mais', 'Kartoffeln', 'Lupinen', 'Erbsen', 'Ackerbohnen', 'Grünland'];
const EINHEITEN = ['l', 'ml', 'kg', 'g'];
const EINHEIT_GRUPPE = { g: 'masse', kg: 'masse', ml: 'volumen', l: 'volumen', 'Stück': 'stueck' };
const EINHEIT_FAKTOR = { g: 1, kg: 1000, ml: 1, l: 1000, 'Stück': 1 };

/** Rechnet zwischen kompatiblen Einheiten um (g<->kg, ml<->l). Bei inkompatiblen
 *  oder unbekannten Einheiten wird der Wert unverändert zurückgegeben (keine
 *  Umrechnung zwischen Masse und Volumen möglich). */
function konvertiereMenge(menge, von, nach){
  if (!von || !nach || von === nach) return menge;
  if (EINHEIT_GRUPPE[von] !== EINHEIT_GRUPPE[nach]) return menge;
  return menge * (EINHEIT_FAKTOR[von] || 1) / (EINHEIT_FAKTOR[nach] || 1);
}

/** Rät anhand des BVL-Katalogtexts eine Standard-Einheit (l/ml/kg/g), Fallback 'l'. */
function rateEinheitAusKatalog(kennr){
  const katalog = katalogEintrag(kennr);
  const text = katalog.map(k => (k.aufwand_einheit || '')).join(' ').toLowerCase();
  if (text.includes('ml')) return 'ml';
  if (text.includes('kg')) return 'kg';
  if (text.includes('g') && !text.includes('kg')) return 'g';
  if (text.includes('l')) return 'l';
  return 'l';
}

/* ============================================================
   STATE
   ============================================================ */
let state = {
  flaechen: [],
  buchungen: [],
  massnahmen: [],
  katalog: [],
  katalogLoaded: false,
  letzterSync: null,
  view: 'start',
  kulturen: [],
  anbauplanung: [],
  arbeitenStamm: [],
  gueter: [],
  arbeiten: [],
  wiegungen: []
};
let userIsTyping = false; // verhindert Überschreiben laufender Eingaben durch Hintergrund-Sync
let massnahmenToggleInFlight = 0; // verhindert, dass ein Sync mitten in einem Checkbox-Toggle die alten Daten zurückschreibt
let massnahmeDraft = { produkte: [], flaechenIds: [], wasser_ha: '', tank_max: '', ergebnisHtml: '', flaechenGesamtOverride: '' };
let buchungEditId = null;
let massnahmeEditId = null;
let bestandKulturFilter = '';
let einbuchenDraft = { suche: '', kennr: '', handelsname: '', menge: '', einheit: 'l', datum: '', charge: '', person: '', manuell: false, manuellName: '', weitereChargen: [] };
let ausbuchenDraft = { kennr: '', charge: '', menge: '', datum: '', person: '', kommentar: '' };
let exportDraft = { typ: 'buchungen', von: '', bis: '', format: 'csv' };
let kulturEditId = null;
let anbauplanungFlaeche = null; // gewählte Fläche in der Anbauplanungs-Ansicht
let anbauplanungForm = { jahr: '', kultur: '', zwischenfrucht: '' };
let arbeitDraft = { arbeit: '', zeilen: [] };
let arbeitEditId = null;
let ertragFlaeche = null;
let ertragJahr = null;
let wiegungEditId = null;
let wiegungDraft = { flaeche_id: '', anbaujahr: '', datum: '', wiegungen: [], kommentar: '' };
let dashboardExpandiert = new Set();

/* ============================================================
   ROBUSTE FETCH-HELFER
   ============================================================ */
async function apiGet(action){
  const url = APP_SCRIPT_URL + (APP_SCRIPT_URL.includes('?') ? '&' : '?') + 'action=' + action;
  for (let attempt = 0; attempt < 4; attempt++){
    try{
      const res = await fetch(url, { method:'GET' });
      const data = await res.json();
      if (data.ok) return data;
      throw new Error(data.error || 'Unbekannter Serverfehler');
    }catch(err){
      if (attempt === 3) throw err;
      await sleep(500 * Math.pow(2, attempt));
    }
  }
}

async function apiPost(action, payload){
  const body = JSON.stringify(Object.assign({ action }, payload));
  for (let attempt = 0; attempt < 4; attempt++){
    try{
      const res = await fetch(APP_SCRIPT_URL, {
        method:'POST',
        headers:{ 'Content-Type':'text/plain' }, // vermeidet CORS-Preflight bei Apps Script
        body
      });
      const data = await res.json();
      if (data.ok) return data.result;
      throw new Error(data.error || 'Unbekannter Serverfehler');
    }catch(err){
      if (attempt === 3) throw err;
      await sleep(500 * Math.pow(2, attempt));
    }
  }
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

/* ============================================================
   SYNC
   ============================================================ */
async function syncOperativeData(showToast, isPeriodic){
  setSyncStatus('lädt');
  try{
    const data = await apiGet('data');
    state.flaechen = data.flaechen || [];
    state.buchungen = data.buchungen || [];
    state.massnahmen = (data.massnahmen || []).map(m => {
      try { m.produkte = typeof m.produkte === 'string' ? JSON.parse(m.produkte) : (m.produkte_json ? JSON.parse(m.produkte_json) : []); } catch(e){ m.produkte = m.produkte || []; }
      try { m.flaechen = typeof m.flaechen === 'string' ? JSON.parse(m.flaechen) : (m.flaechen_json ? JSON.parse(m.flaechen_json) : []); } catch(e){ m.flaechen = m.flaechen || []; }
      return m;
    });
    state.kulturen = data.kulturen || [];
    state.anbauplanung = data.anbauplanung || [];
    state.arbeitenStamm = data.arbeitenStamm || [];
    state.gueter = data.gueter || [];
    state.arbeiten = (data.arbeiten || []).map(a => {
      try { a.zeilen = typeof a.zeilen === 'string' ? JSON.parse(a.zeilen) : (a.zeilen_json ? JSON.parse(a.zeilen_json) : []); } catch(e){ a.zeilen = a.zeilen || []; }
      try { a.zeilenErledigt = typeof a.zeilenErledigt === 'string' ? JSON.parse(a.zeilenErledigt) : (a.zeilen_erledigt_json ? JSON.parse(a.zeilen_erledigt_json) : []); } catch(e){ a.zeilenErledigt = a.zeilenErledigt || []; }
      return a;
    });
    state.wiegungen = (data.wiegungen || []).map(w => {
      try { w.wiegungen = typeof w.wiegungen === 'string' ? JSON.parse(w.wiegungen) : (w.wiegungen_json ? JSON.parse(w.wiegungen_json) : []); } catch(e){ w.wiegungen = w.wiegungen || []; }
      return w;
    });
    state.letzterSync = data.letzterSync;
    setSyncStatus('ok');
    // Der automatische Hintergrund-Sync (alle 22s) zeichnet die Seite NICHT neu, damit
    // laufende Eingaben in irgendeinem Feld nie überschrieben werden können – egal wo.
    // Die frischen Daten stehen trotzdem sofort bereit, sobald als Nächstes durch eine
    // echte Nutzeraktion (Klick, Tab-Wechsel, manueller Sync-Button) neu gezeichnet wird.
    if (!isPeriodic) render();
    if (showToast) toast('Aktualisiert');
  }catch(err){
    setSyncStatus('fehler');
    if (showToast) toast('Sync fehlgeschlagen: ' + err.message);
    // WICHTIG: bei Fehler bleiben die zuletzt bekannten Daten unverändert (kein leeres Überschreiben)
  }
}


async function loadKatalogOnce(){
  if (state.katalogLoaded) return;
  try{
    const data = await apiGet('katalog');
    state.katalog = data.katalog || [];
    state.katalogLoaded = true;
    render();
  }catch(err){
    toast('PSM-Katalog konnte nicht geladen werden: ' + err.message);
  }
}

function setSyncStatus(status){
  const dot = document.getElementById('syncDot');
  const label = document.getElementById('syncLabel');
  if (status === 'ok'){ dot.className = 'sync-dot'; label.textContent = 'Sync'; }
  else if (status === 'lädt'){ dot.className = 'sync-dot warn'; label.textContent = '…'; }
  else { dot.className = 'sync-dot warn'; label.textContent = 'Fehler'; }
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

/* ============================================================
   BESTANDSBERECHNUNG (aus Buchungen)
   ============================================================ */
function berechneBestand(alleAnzeigen){
  const map = {}; // kennr -> {handelsname, gesamt, einheit, chargen:{charge:menge}}
  state.buchungen.forEach(b => {
    if (!map[b.kennr]) map[b.kennr] = { kennr:b.kennr, handelsname:b.handelsname, gesamt:0, einheit:'', chargen:{} };
    const vz = b.typ === 'Ausbuchung' ? -1 : 1;
    const menge = parseFloat(b.menge) || 0;
    map[b.kennr].gesamt += vz * menge;
    if (b.einheit) map[b.kennr].einheit = b.einheit; // jeweils letzte bekannte Einheit
    const charge = b.charge || '(ohne Charge)';
    map[b.kennr].chargen[charge] = (map[b.kennr].chargen[charge] || 0) + vz * menge;
  });
  if (alleAnzeigen) return Object.values(map); // auch Produkte mit 0 Bestand (schon mal eingebucht, aktuell leer)
  return Object.values(map).filter(p => Math.abs(p.gesamt) > 0.0001);
}

function katalogEintrag(kennr){
  return state.katalog.filter(k => k.kennr === kennr);
}

/**
 * Versucht, aus den Wartezeit-Rohdaten (JSON aus der BVL-API, Feld-Layout nicht
 * zu 100% dokumentiert) eine Anzahl Tage zu extrahieren. Probiert dafür mehrere
 * plausible Feldnamen durch. Gibt null zurück, wenn nichts Eindeutiges gefunden
 * wird – dann wird an anderer Stelle auf die Rohdaten zurückgefallen, statt eine
 * falsche Zahl vorzutäuschen.
 */
function extrahiereWartezeitTage(wartezeitRohJson){
  if (!wartezeitRohJson) return null;
  let eintraege;
  try { eintraege = JSON.parse(wartezeitRohJson); } catch(e) { return null; }
  if (!Array.isArray(eintraege) || eintraege.length === 0) return null;
  const kandidatenFelder = ['wartezeit_tage', 'wartezeit', 'tage', 'anzahl_tage', 'frist_tage'];
  for (const eintrag of eintraege){
    for (const feld of kandidatenFelder){
      const wert = eintrag[feld];
      if (wert !== undefined && wert !== null && wert !== '' && !isNaN(parseFloat(wert))){
        return parseFloat(wert);
      }
    }
  }
  return null;
}

function istAbgelaufen(zulEnde){
  if (!zulEnde) return false;
  const d = new Date(zulEnde);
  return d.getTime() < Date.now();
}

/* ============================================================
   ANBAUPLANUNG / FRUCHTFOLGE-HELFER
   ============================================================ */
/** Wandelt "25/26" in eine sortierbare Zahl (2025) um. Unbekanntes Format -> null. */
function parseAnbaujahr(jahr){
  if (!jahr) return null;
  const m = String(jahr).match(/^(\d{2})\/(\d{2})$/);
  if (!m) return null;
  return 2000 + parseInt(m[1], 10);
}

function sortiereJahre(jahre){
  return jahre.slice().sort((a,b) => (parseAnbaujahr(a) || 0) - (parseAnbaujahr(b) || 0));
}

function alleAnbaujahre(){
  return sortiereJahre([...new Set(state.anbauplanung.map(p => p.anbaujahr))]);
}

/** Wandelt ein Datum in das zugehörige Landwirtschafts-/Anbaujahr um (Beginn 1. August). */
function datumZuAnbaujahr(datumStr){
  if (!datumStr) return null;
  const d = new Date(datumStr);
  if (isNaN(d.getTime())) return null;
  const jahr = d.getMonth() >= 7 ? d.getFullYear() : d.getFullYear() - 1; // Monat 7 = August (0-indexiert)
  const kurz = n => String(n).slice(-2);
  return kurz(jahr) + '/' + kurz(jahr + 1);
}

/** Sammelt alle erledigten/bestätigten Arbeiten einer bestimmten Art (z.B. "Aussaat"),
 *  die diese Fläche enthalten, neuestes Datum zuerst. */
function arbeitsEreignisseFuerFlaeche(flaecheId, arbeitName){
  return state.arbeiten
    .filter(a => a.arbeit === arbeitName)
    .filter(a => (a.zeilen || []).some(z => z.flaeche_id === flaecheId))
    .map(a => {
      const eintrag = (a.zeilenErledigt || []).find(e => e.flaeche_id === flaecheId);
      const datum = (eintrag && eintrag.datum) ||
        ((a.status === 'erledigt' || a.status === 'bestaetigt') ? a.erledigt_am : null);
      return { datum, zeile: (a.zeilen || []).find(z => z.flaeche_id === flaecheId), arbeit: a };
    })
    .filter(e => e.datum)
    .sort((x, y) => new Date(y.datum) - new Date(x.datum));
}

/**
 * Ermittelt die "aktuelle Kultur" einer Fläche für die Anzeige:
 * - Wenn zuletzt eine Zwischenfrucht gesät wurde (und danach noch keine neue
 *   Hauptfrucht-Aussaat) -> zeigt die Zwischenfrucht, dahinter die geplante
 *   nächste Hauptfrucht.
 * - Wenn zuletzt eine Hauptfrucht ausgesät wurde (und danach noch nicht
 *   geerntet) -> zeigt diese Hauptfrucht (aus der Anbauplanung des zur
 *   Aussaat passenden Anbaujahres).
 * - Sonst (geerntet oder noch nie ausgesät) -> zeigt die für das laufende
 *   Anbaujahr geplante Kultur, mit Hinweis "geplant".
 */
function aktuelleKulturInfo(flaecheId){
  const aussaaten = arbeitsEreignisseFuerFlaeche(flaecheId, 'Aussaat');
  const ernten = arbeitsEreignisseFuerFlaeche(flaecheId, 'Ernte');
  const zfs = arbeitsEreignisseFuerFlaeche(flaecheId, 'Zwischenfrucht säen');
  const letzteAussaat = aussaaten[0] || null;
  const letzteErnte = ernten[0] || null;
  const letzteZF = zfs[0] || null;

  function geplanteKultur(bezugsdatum){
    const jahr = datumZuAnbaujahr(bezugsdatum || heute());
    const e = state.anbauplanung.find(p => p.flaeche_id === flaecheId && p.anbaujahr === jahr);
    return e && e.kultur ? e.kultur : null;
  }

  if (letzteZF && (!letzteAussaat || new Date(letzteZF.datum) > new Date(letzteAussaat.datum))){
    const naechste = geplanteKultur();
    return { text: (letzteZF.zeile && letzteZF.zeile.gut) || 'Zwischenfrucht', badge: 'Zwischenfrucht', naechste };
  }
  if (letzteAussaat && (!letzteErnte || new Date(letzteAussaat.datum) > new Date(letzteErnte.datum))){
    const kultur = geplanteKultur(letzteAussaat.datum);
    return { text: kultur || '–', badge: '', naechste: null };
  }
  const geplant = geplanteKultur();
  return { text: geplant || '–', badge: geplant ? 'geplant' : '', naechste: null };
}

/** Sammelt alle Ereignisse, in denen diese Fläche vorkommt, für die Historie-Ansicht. */
function historieFuerFlaeche(flaecheId){
  const eintraege = [];

  state.anbauplanung.filter(p => p.flaeche_id === flaecheId).forEach(p => {
    const jahr = parseAnbaujahr(p.anbaujahr);
    eintraege.push({
      sortDatum: jahr ? new Date(jahr, 7, 1).getTime() : 0,
      icon: '📅', titel: 'Anbauplanung ' + p.anbaujahr,
      sub: (p.kultur || '–') + (p.zwischenfrucht ? ' · Zwischenfrucht: ' + p.zwischenfrucht : '')
    });
  });

  state.massnahmen.filter(m => (m.flaechen || []).includes(flaecheId)).forEach(m => {
    const datum = m.erledigt_am || m.erstellt_am;
    const statusText = m.status === 'geplant' ? 'geplant' : (m.status === 'erledigt' ? 'erledigt' : 'bestätigt');
    eintraege.push({
      sortDatum: datum ? new Date(datum).getTime() : 0,
      icon: '🌱', titel: 'PSM-Maßnahme: ' + ((m.produkte || []).map(p => p.handelsname).join(', ') || '–'),
      sub: (datum ? formatDatum(datum) + ' · ' : '') + statusText
    });
  });

  state.arbeiten.filter(a => (a.zeilen || []).some(z => z.flaeche_id === flaecheId)).forEach(a => {
    const zeile = (a.zeilen || []).find(z => z.flaeche_id === flaecheId);
    const eintragErledigt = (a.zeilenErledigt || []).find(e => e.flaeche_id === flaecheId);
    const datum = (eintragErledigt && eintragErledigt.datum) || a.erledigt_am || a.erstellt_am;
    const statusProFlaeche = eintragErledigt && eintragErledigt.datum ? 'erledigt' : (a.status === 'bestaetigt' ? 'bestätigt' : 'geplant');
    eintraege.push({
      sortDatum: datum ? new Date(datum).getTime() : 0,
      icon: '🚜', titel: a.arbeit + (zeile && zeile.gut ? ': ' + zeile.gut : ''),
      sub: (datum ? formatDatum(datum) + ' · ' : '') + statusProFlaeche
    });
  });

  state.wiegungen.filter(w => w.flaeche_id === flaecheId).forEach(w => {
    const gesamt = (w.wiegungen || []).reduce((s, x) => s + Math.max(0, (parseFloat(x.vollgewicht) || 0) - (parseFloat(x.leergewicht) || 0)), 0);
    eintraege.push({
      sortDatum: w.datum ? new Date(w.datum).getTime() : 0,
      icon: '⚖️', titel: 'Ertragserfassung ' + w.anbaujahr,
      sub: (w.datum ? formatDatum(w.datum) + ' · ' : '') + formatZahl(gesamt) + ' kg'
    });
  });

  return eintraege.sort((a, b) => b.sortDatum - a.sortDatum);
}

/** Prüft, ob eine Kultur auf einer Fläche in einem Jahr den Mindestanbauabstand
 *  verletzt (Vergleich gegen alle anderen erfassten Jahre derselben Fläche mit
 *  derselben Kultur). Gibt null zurück, wenn kein Verstoß vorliegt, sonst das
 *  Konfliktjahr. excludeId: eigener Eintrag wird bei der Prüfung ausgeschlossen. */
function pruefeFruchtfolgeVerstoss(flaecheId, jahr, kultur, excludeId){
  if (!kultur) return null;
  const kulturDef = state.kulturen.find(k => k.name === kultur);
  const abstand = kulturDef ? parseFloat(kulturDef.anbauabstand_jahre) : null;
  if (!abstand) return null;
  const thisYear = parseAnbaujahr(jahr);
  if (thisYear === null) return null;
  let konflikt = null;
  state.anbauplanung.forEach(p => {
    if (p.flaeche_id !== flaecheId || p.kultur !== kultur) return;
    if (excludeId && p.id === excludeId) return;
    if (p.anbaujahr === jahr) return;
    const otherYear = parseAnbaujahr(p.anbaujahr);
    if (otherYear === null) return;
    const diff = Math.abs(thisYear - otherYear);
    if (diff > 0 && diff < abstand){
      if (konflikt === null || otherYear > konflikt) konflikt = otherYear;
    }
  });
  return konflikt === null ? null : String(konflikt);
}

/* ---------- START: Bestandsübersicht ---------- */
function renderStart(){
  const bestand = berechneBestand(true);
  if (bestand.length === 0){
    return `<div class="card"><div class="empty">Noch kein Bestand erfasst.<br>Nutze unten „Buchen“, um PSM einzubuchen.</div></div>`;
  }

  // Jedem Bestandsprodukt seine Kultur(en) aus dem Katalog anhängen
  bestand.forEach(p => {
    const katalog = katalogEintrag(p.kennr);
    p._kulturen = [...new Set(katalog.map(k => k.kultur_name).filter(Boolean))];
  });

  const alleKulturen = [...new Set(bestand.flatMap(p => p._kulturen))].sort((a,b) => a.localeCompare(b, 'de'));

  const gefiltert = bestandKulturFilter
    ? bestand.filter(p => p._kulturen.includes(bestandKulturFilter))

  const sortiert = gefiltert.slice().sort((a,b) => a.handelsname.localeCompare(b.handelsname, 'de'));

  const rows = sortiert.map(p => {

    const kulturen = p._kulturen.join(', ') || '–';
    const wirkstoffe = [...new Set(katalog.map(k => k.wirkstoffe).filter(Boolean))].join(', ');
    const abgelaufen = katalog.some(k => istAbgelaufen(k.zul_ende));
    const leer = Math.abs(p.gesamt) <= 0.0001;
    return `
      <div class="row" data-open-produkt="${p.kennr}" ${leer ? 'style="opacity:.55"' : ''}>
        <div>
          <div class="name">${escapeHtml(p.handelsname || p.kennr)}</div>
          <div class="sub">${escapeHtml(kulturen)}</div>
          ${wirkstoffe ? `<div class="sub" style="color:var(--red)">${escapeHtml(wirkstoffe)}</div>` : ''}
        </div>

          <div class="amount">${leer ? 'nicht auf Lager' : formatZahl(p.gesamt) + ' ' + escapeHtml(p.einheit || '')}</div>
          ${abgelaufen ? '<span class="badge warn">Zulassung abgelaufen</span>' : ''}
        </div>
      </div>`;
  }).join('') || '<div class="empty">Kein Bestand für diese Kultur.</div>';

  const exportHtml = `

        <option value="pdf" ${exportDraft.format === 'pdf' ? 'selected' : ''}>PDF (Druckansicht – "Als PDF speichern")</option>
      </select>
      <div class="btn-row"><button class="btn btn-outline" id="exportBuchungenBtn">Exportieren</button></div>

      <div data-open-flaeche="${f.id}" style="flex:1 1 100%;margin-bottom:8px;cursor:pointer">
        <div class="name">${escapeHtml(f.name)}</div>
        <div class="sub">${formatZahl(f.groesse_ha)} ha</div>
        <div class="sub">${escapeHtml(aktuell.text)}${aktuell.badge ? ` <span class="badge pending">${escapeHtml(aktuell.badge)}</span>` : ''}${aktuell.naechste ? ` · geplant: ${escapeHtml(aktuell.naechste)}` : ''}</div>
      </div>
      <div class="btn-row" style="margin-top:0;flex:0 0 auto">
        ${f.standort_link ? `<a class="btn btn-sm btn-outline" href="${escapeHtml(f.standort_link)}" target="_blank" rel="noopener">📍 Route</a>` : ''}
        <button class="btn btn-sm btn-outline" data-edit-flaeche="${f.id}">Bearbeiten</button>
        <button class="btn btn-sm btn-danger" data-delete-flaeche="${f.id}">Löschen</button>
      </div>
    </div>
  `;}).join('') || '<div class="empty">Noch keine Flächen angelegt.</div>';

  return `
    <a class="back-link" data-view-link="mehr">← Zurück</a>
    <div class="card"><h2>Flächen</h2>${rows}</div>
    <div class="card">
      <h2>Neue Fläche</h2>
      <label>Name</label>
      <input type="text" id="flName" placeholder="z.B. Schlag Nord">
      <label>Größe (ha)</label>
      <input type="number" id="flGroesse" step="0.01">
      <label>Standort-Link (Google Maps oder Apple Karten)</label>
      <input type="text" id="flStandort" placeholder="Link aus Maps-App einfügen">
      <div class="btn-row">
        <button class="btn btn-primary" id="flSpeichern">Fläche anlegen</button>
      </div>
    </div>
  `;
}

function oeffneFlaecheModal(id){

  document.getElementById('flModalAbbrechen').onclick = schliesseFlaecheModal;

}

/* ---------- MASSNAHMEN: LISTE ---------- */
function renderMassnahmen(){
  const offene = state.massnahmen.filter(m => m.status !== 'bestaetigt');
  const rows = offene.map(m => {
    const produkte = (m.produkte || []).map(p => p.handelsname).join(', ');
    const flaechenNamen = (m.flaechen || []).map(id => {
      const f = state.flaechen.find(x => x.id === id);
      return f ? f.name : '?';
    }).join(', ');
    let badge = '<span class="badge pending">geplant</span>';
    if (m.status === 'erledigt') badge = '<span class="badge ok">erledigt – zu bestätigen</span>';
    const bearbeitenBtn = m.status === 'geplant'
      ? `<button class="btn btn-sm btn-outline" data-edit-massnahme="${m.id}" style="margin-top:6px">Bearbeiten</button>
         <button class="btn btn-sm btn-danger" data-delete-massnahme="${m.id}" style="margin-top:6px">Löschen</button>` : '';
    return `
      <div class="row">
        <div data-open-massnahme="${m.id}" style="flex:1;cursor:pointer">
          <div class="name">${escapeHtml(produkte || 'Maßnahme')}</div>
          <div class="sub">${escapeHtml(flaechenNamen)}</div>
        </div>
        <div style="text-align:right">${badge}<br>${bearbeitenBtn}</div>
      </div>`;
  }).join('') || '<div class="empty">Keine offenen Maßnahmen.</div>';

  const hatUnfertigeNeuePlanung = !massnahmeEditId &&
    (massnahmeDraft.produkte.length > 0 || massnahmeDraft.flaechenIds.length > 0);

  return `
    <a class="back-link" data-view-link="mehr">← Zurück</a>
    <div class="card"><h2>PSM-Maßnahmen (Pflanzenschutz)</h2>${rows}</div>
    ${hatUnfertigeNeuePlanung ? `
      <div class="card" style="background:var(--amber-soft)">
        <h2>Ungespeicherte Planung</h2>
        <div class="sub">Du hast eine begonnene, noch nicht gespeicherte Maßnahmenplanung.</div>
        <div class="btn-row">
          <button class="btn btn-primary" id="planungFortsetzen">Weiter planen</button>
          <button class="btn btn-outline" id="planungVerwerfen">Verwerfen</button>
        </div>
      </div>
    ` : ''}
    <div class="card">
      <button class="btn btn-primary" id="neueMassnahme">+ Neue Maßnahme planen</button>
    </div>
  `;
}

/* ---------- MASSNAHME PLANEN ---------- */
/** Fügt ein Produkt (aus Bestand-Dropdown oder Suche) der aktuellen Maßnahmenplanung hinzu, falls noch nicht enthalten. */
function produktZuMassnahmeHinzufuegen(kennr, handelsname){
  if (massnahmeDraft.produkte.find(p => p.kennr === kennr)) return;
  massnahmeDraft.produkte.push({ kennr, handelsname, aufwand_pro_ha: '', einheit: rateEinheitAusKatalog(kennr) });
  render();
}

function renderMassnahmePlanen(){
  const bestandAktuell = berechneBestand();
  const produktZeilen = massnahmeDraft.produkte.map((p, i) => {
    const katalog = katalogEintrag(p.kennr);
    const maxWerte = [...new Set(katalog
      .filter(k => k.aufwandmenge)
      .map(k => `${k.kultur_name}: max. ${k.aufwandmenge} ${k.aufwand_einheit || ''}`.trim()))];
    // Aktive Warnung, wenn die eingetragene Aufwandmenge die laut BVL zulässige
    // Höchstmenge überschreitet (umgerechnet in die jeweils zulässige Einheit).
    const eingegebeneMenge = parseFloat(p.aufwand_pro_ha);
    const ueberschreitungen = !isNaN(eingegebeneMenge) ? katalog.filter(k => {
      const maxErlaubt = parseFloat(k.aufwandmenge);
      if (isNaN(maxErlaubt)) return false;
      const eingegebenInKatalogEinheit = konvertiereMenge(eingegebeneMenge, p.einheit, k.aufwand_einheit);
      return eingegebenInKatalogEinheit > maxErlaubt + 1e-6;
    }) : [];
    const einheitOptionen = EINHEITEN.map(e => `<option value="${e}" ${p.einheit === e ? 'selected' : ''}>${e}</option>`).join('');
    const bestandProdukt = bestandAktuell.find(b => b.kennr === p.kennr);
    const bestandText = bestandProdukt ? `${formatZahl(bestandProdukt.gesamt)} ${escapeHtml(bestandProdukt.einheit || '')} im Bestand` : '0 im Bestand';
    return `
    <div class="produkt-line">
      <div class="grow">
        <input type="text" value="${escapeHtml(p.handelsname)}" readonly>
      </div>
      <div class="aufwand">
        <input type="number" step="0.01" placeholder="Aufwand/ha" value="${p.aufwand_pro_ha || ''}" data-aufwand-index="${i}">
      </div>
      <div style="width:80px">
        <select data-einheit-index="${i}">${einheitOptionen}</select>
      </div>
      <button class="btn btn-sm btn-danger" data-remove-produkt="${i}">✕</button>
    </div>
    <div class="sub" style="margin:-4px 0 4px">${escapeHtml(bestandText)}</div>
    ${maxWerte.length ? `<div class="sub" style="margin:-4px 0 8px">Zulässig: ${escapeHtml(maxWerte.join(' · '))}</div>` : ''}
    ${ueberschreitungen.length ? `<div class="badge warn" style="margin:-4px 0 8px;display:inline-block">⚠️ Zulässige Aufwandmenge überschritten (${escapeHtml(ueberschreitungen.map(k => k.kultur_name).join(', '))})</div>` : ''}
  `;
  }).join('') || '<div class="empty">Noch keine Produkte hinzugefügt.</div>';

  const flaechenCheckboxen = state.flaechen.map(f => {
    const aktuelleK = aktuelleKulturInfo(f.id).text;
    return `
    <div class="flaeche-check">
      <input type="checkbox" id="fl_${f.id}" value="${f.id}" ${massnahmeDraft.flaechenIds.includes(f.id) ? 'checked' : ''}>
      <label for="fl_${f.id}" style="margin:0">${escapeHtml(f.name)} (${formatZahl(f.groesse_ha)} ha${aktuelleK && aktuelleK !== '–' ? ' · ' + escapeHtml(aktuelleK) : ''})</label>
    </div>
  `;}).join('') || '<div class="empty">Erst Flächen anlegen.</div>';

  const flaechenMitKultur = state.flaechen.map(f => ({ f, kultur: aktuelleKulturInfo(f.id).text })).filter(x => x.kultur && x.kultur !== '–');
  const vorhandeneKulturen = [...new Set(flaechenMitKultur.map(x => x.kultur))];
  const kulturCheckboxen = vorhandeneKulturen.map(k => {
    const idsFuerKultur = flaechenMitKultur.filter(x => x.kultur === k).map(x => x.f.id);
    const alleAusgewaehlt = idsFuerKultur.length > 0 && idsFuerKultur.every(id => massnahmeDraft.flaechenIds.includes(id));
    return `
      <div class="flaeche-check">
        <input type="checkbox" id="kult_${k}" data-kultur-check="${escapeHtml(k)}" ${alleAusgewaehlt ? 'checked' : ''}>
        <label for="kult_${k}" style="margin:0">Alle "${escapeHtml(k)}"-Flächen</label>
      </div>`;
  }).join('');

  const flaechenGesamtAuto = massnahmeDraft.flaechenIds.reduce((sum, id) => {
    const f = state.flaechen.find(x => x.id === id);
    return sum + (f ? parseFloat(f.groesse_ha) || 0 : 0);
  }, 0);

  return `
    <a class="back-link" data-view-link="arbeiten">← Zurück</a>
    <div class="card">
      <h2>Produkte hinzufügen</h2>
      <label>Aus Lagerbestand wählen</label>
      <select id="mnBestandAuswahl">
        <option value="">– Mittel aus Bestand wählen –</option>
        ${bestandFuerAuswahl().map(p => `<option value="${p.kennr}">${escapeHtml(p.handelsname)} (${formatZahl(p.gesamt)} ${escapeHtml(p.einheit || '')})</option>`).join('')}
      </select>
      <label style="margin-top:12px">Oder manuell suchen (auch Mittel außerhalb des Bestands)</label>
      <div class="searchbox">
        <input type="text" id="mnSuche" placeholder="Produktname suchen…" autocomplete="off">
        <div class="search-results hidden" id="mnErgebnisse"></div>
      </div>
      ${produktZeilen}
    </div>
    <div class="card">
      <h2 style="display:flex;justify-content:space-between;align-items:center">
        <span>Flächen auswählen</span>
        <span class="sub" style="margin:0">${formatZahl(flaechenGesamtAuto)} ha ausgewählt</span>
      </h2>
      ${vorhandeneKulturen.length ? `
        <label>Nach Kultur auswählen/abwählen</label>
        ${kulturCheckboxen}
        <div style="border-bottom:1px solid var(--line);margin:10px 0"></div>
      ` : ''}
      ${flaechenCheckboxen}
      <label style="margin-top:12px">Gesamtfläche für diese Maßnahme (ha) – optional manuell anpassen</label>
      <input type="number" id="mnFlaecheOverride" step="0.01" placeholder="${formatZahl(flaechenGesamtAuto)} (automatisch aus Auswahl)" value="${massnahmeDraft.flaechenGesamtOverride}">
      <div class="sub">Leer lassen für automatische Summe der ausgewählten Flächen. Angepasster Wert gilt für Bedarfsberechnung, Spritzplanung und Ausbuchung.</div>
    </div>
    <div class="card">
      <h2>Spritzplanung</h2>
      <label>Wassermenge (l/ha)</label>
      <input type="number" id="mnWasser" step="1" placeholder="z.B. 200" value="${massnahmeDraft.wasser_ha}">
      <label>Maximales Tankvolumen (l)</label>
      <input type="number" id="mnTank" step="1" placeholder="z.B. 3000" value="${massnahmeDraft.tank_max}">
      <button class="btn btn-outline" id="mnBerechnen" style="margin-top:10px">Berechnen</button>
      <div id="mnErgebnis">${massnahmeDraft.ergebnisHtml || ''}</div>
    </div>
    <div class="card">
      <button class="btn btn-primary" id="mnSpeichern">${massnahmeEditId ? 'Änderungen speichern' : 'Maßnahme speichern'}</button>
    </div>
  `;
}

/* ---------- MASSNAHME ERLEDIGEN / DETAIL ---------- */
function renderMassnahmeErledigen(id){
  const m = state.massnahmen.find(x => x.id === id);
  if (!m) return `<a class="back-link" data-view-link="arbeiten">← Zurück</a><div class="card"><div class="empty">Maßnahme nicht gefunden.</div></div>`;

  const flaechenNamen = (m.flaechen || []).map(fid => {
    const f = state.flaechen.find(x => x.id === fid);
    return f ? `${f.name} (${formatZahl(f.groesse_ha)} ha)` : '?';
  }).join(', ');

  const flaechenGesamt = berechneFlaechenGesamt(m.flaechen || [], m.flaechen_gesamt_override);

  const produktZeilen = (m.produkte || []).map((p, i) => {
    const benoetigteMenge = (parseFloat(p.aufwand_pro_ha) || 0) * flaechenGesamt;
    const bestand = berechneBestand().find(b => b.kennr === p.kennr);
    const chargenEntries = bestand ? Object.entries(bestand.chargen).filter(([,menge]) => Math.abs(menge) > 0.0001) : [];
    const bestandInProduktEinheit = bestand ? konvertiereMenge(bestand.gesamt, bestand.einheit, p.einheit) : 0;
    const nichtGenug = !bestand || bestandInProduktEinheit < benoetigteMenge;
    const chargenOptionen = chargenEntries
      .map(([c, menge]) => `<option value="${escapeHtml(c)}">${escapeHtml(c)} (${formatZahl(menge)} ${escapeHtml(bestand.einheit || '')} verfügbar)</option>`).join('');
    // Bei genau einer verfügbaren Charge (auch "(ohne Charge)") automatisch vorauswählen,
    // statt eine manuelle Auswahl zu erzwingen. Bei mehreren Chargen muss bewusst gewählt werden.
    const selectHtml = chargenEntries.length === 1
      ? `<select data-erledigen-charge="${i}" data-kennr="${p.kennr}" data-handelsname="${escapeHtml(p.handelsname)}" data-benoetigt="${benoetigteMenge}" data-einheit="${escapeHtml(p.einheit || '')}">${chargenOptionen}</select>`
      : `<select data-erledigen-charge="${i}" data-kennr="${p.kennr}" data-handelsname="${escapeHtml(p.handelsname)}" data-benoetigt="${benoetigteMenge}" data-einheit="${escapeHtml(p.einheit || '')}">
           <option value="">– wählen –</option>${chargenOptionen}
         </select>`;
    return `
      <div class="card" style="background:#faf9f5">
        <div class="name">${escapeHtml(p.handelsname)}</div>
        <div class="sub">Benötigt: ${formatZahl(benoetigteMenge)} ${escapeHtml(p.einheit || '')}</div>
        ${nichtGenug ? '<div class="badge warn">Bestand reicht nicht aus!</div>' : ''}
        <label>Charge${chargenEntries.length === 1 ? '' : ' wählen'}</label>
        ${selectHtml}
      </div>
    `;
  }).join('');

  const rezepturHtml = (m.produkte || []).map(p =>
    `<div>${escapeHtml(p.handelsname)}: ${formatZahl(p.aufwand_pro_ha)} ${escapeHtml(p.einheit || '')} / ha</div>`
  ).join('');

  const tankfuellungenHtml = m.status === 'geplant'
    ? berechneTankfuellungenInteraktivHtml(m, m.produkte || [], flaechenGesamt, parseFloat(m.wasser_ha), parseFloat(m.tank_max))
    : berechneTankfuellungenHtml(m.produkte || [], flaechenGesamt, parseFloat(m.wasser_ha), parseFloat(m.tank_max));

  const flaechenErledigt = m.flaechenErledigt || [];
  const flaechenChecklisteHtml = (m.flaechen || []).map(fid => {
    const f = state.flaechen.find(x => x.id === fid);
    const istErledigt = flaechenErledigt.includes(fid);
    return `
      <div class="row">
        <label style="display:flex;align-items:center;gap:8px;margin:0;flex:1">
          <input type="checkbox" data-flaeche-check="${fid}" data-massnahme-id="${m.id}" ${istErledigt ? 'checked' : ''} style="width:20px;height:20px">
          <span>${f ? escapeHtml(f.name) + ' (' + formatZahl(f.groesse_ha) + ' ha)' : '?'}</span>
        </label>
        ${istErledigt ? '<span class="badge ok">erledigt</span>' : ''}
      </div>`;
  }).join('') || '<div class="empty">Keine Flächen zugeordnet.</div>';

  if (m.status === 'geplant'){
    return `
      <a class="back-link" data-view-link="arbeiten">← Zurück</a>
      <div class="card">
        <h2>Maßnahme erledigen</h2>
      </div>
      <div class="card">
        <h2>Produkte (Aufwandmenge pro ha)</h2>
        ${rezepturHtml}
      </div>
      <div class="card">
        <h2>Flächen</h2>
        ${flaechenChecklisteHtml}
      </div>
      <div class="card">
        <h2>Mischungen / Tankfüllungen</h2>
        ${tankfuellungenHtml}
      </div>
      ${produktZeilen}
      <div class="card">
        <label>Datum</label>
        <input type="date" id="erlDatum" value="${heute()}">
        <label>Person</label>
        <input type="text" id="erlPerson" placeholder="Dein Name">
        <div class="btn-row"><button class="btn btn-amber" id="erlSpeichern" data-massnahme-id="${m.id}">Als erledigt verbuchen</button></div>
      </div>
    `;
  }

  if (m.status === 'erledigt'){
    return `
      <a class="back-link" data-view-link="arbeiten">← Zurück</a>
      <div class="card">
        <h2>Maßnahme erledigt</h2>
        <div class="sub">Erledigt von ${escapeHtml(m.erledigt_von || '–')} am ${formatDatum(m.erledigt_am)}</div>
        <div class="sub">Flächen: ${escapeHtml(flaechenNamen)}</div>
      </div>
      <div class="card">
        <h2>Produkte (Aufwandmenge pro ha)</h2>
        ${rezepturHtml}
      </div>
      <div class="card">
        <h2>Mischungen / Tankfüllungen</h2>
        ${tankfuellungenHtml}
      </div>
      <div class="card">
        <p style="font-size:14px">Sobald diese Maßnahme in der Ackerschlagdatei eingetragen wurde, hier bestätigen – sie verschwindet dann aus der App.</p>
        <label>Person (Bestätigung)</label>
        <input type="text" id="bestPerson" placeholder="Dein Name">
        <div class="btn-row"><button class="btn btn-primary" id="bestSpeichern" data-massnahme-id="${m.id}">In Ackerschlagdatei erledigt – bestätigen</button></div>
      </div>
    `;
  }

  return '';
}

/* ---------- START-ÜBERSICHT (offene Maßnahmen + Arbeiten) ---------- */
function renderUebersicht(){
  const offeneMassnahmen = state.massnahmen.filter(m => m.status !== 'bestaetigt');
  const offeneArbeiten = state.arbeiten.filter(a => a.status !== 'bestaetigt');

  function massnahmeZeile(m){
    const produkte = (m.produkte || []).map(p => p.handelsname).join(', ');
    const flaechenNamen = (m.flaechen || []).map(id => {
      const f = state.flaechen.find(x => x.id === id);
      return f ? f.name : '?';
    }).join(', ');
    const badge = m.status === 'erledigt' ? '<span class="badge ok">erledigt – zu bestätigen</span>' : '<span class="badge pending">geplant</span>';
    return `
      <div class="row" data-open-massnahme="${m.id}" style="cursor:pointer">
        <div>
          <div class="name">🌱 ${escapeHtml(produkte || 'PSM-Maßnahme')}</div>
          <div class="sub">${escapeHtml(flaechenNamen)}</div>
        </div>
        <div>${badge}</div>
      </div>`;
  }

  function arbeitZeile(a){
    const flaechenNamen = [...new Set((a.zeilen || []).map(z => {
      const f = state.flaechen.find(x => x.id === z.flaeche_id);
      return f ? f.name : '?';
    }))].join(', ');
    const badge = a.status === 'erledigt' ? '<span class="badge ok">erledigt – zu bestätigen</span>' : '<span class="badge pending">geplant</span>';
    return `
      <div class="row" data-open-arbeit="${a.id}" style="cursor:pointer">
        <div>
          <div class="name">🚜 ${escapeHtml(a.arbeit || 'Arbeit')}</div>
          <div class="sub">${escapeHtml(flaechenNamen)}</div>
        </div>
        <div>${badge}</div>
      </div>`;
  }

  const alle = [...offeneMassnahmen.map(m => ({ typ:'massnahme', item:m })), ...offeneArbeiten.map(a => ({ typ:'arbeit', item:a }))]
    .sort((x,y) => {
      const sx = x.item.status === 'erledigt' ? 0 : 1;
      const sy = y.item.status === 'erledigt' ? 0 : 1;
      return sx - sy;
    });

  const rows = alle.map(x => x.typ === 'massnahme' ? massnahmeZeile(x.item) : arbeitZeile(x.item)).join('')
    || '<div class="empty">Aktuell keine offenen Maßnahmen oder Arbeiten.</div>';

  return `<div class="card"><h2>Offene Punkte</h2>${rows}</div>`;
}

/** Öffnet ein neues Fenster mit einer leeren, druckfertigen Wiegeliste (Fläche,
 *  Kultur, Größe oben vorausgefüllt) zum handschriftlichen Ausfüllen. */
function druckeLeereWiegeliste(flaecheId, anbaujahr){
  const f = state.flaechen.find(x => x.id === flaecheId);
  if (!f) return;
  const kultur = aktuelleKulturInfo(flaecheId).text;
  const zeilenAnzahl = 15;
  const zeilenHtml = Array.from({ length: zeilenAnzahl }).map(() => `
    <tr>
      <td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td>
    </tr>`).join('');
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Wiegeliste ${escapeHtml(f.name)}</title>
  <style>
    body{font-family:Arial,sans-serif;padding:24px;color:#111}
    h1{font-size:20px;margin:0 0 4px}
    .kopf{margin-bottom:18px;font-size:14px}
    .kopf div{margin-bottom:2px}
    table{width:100%;border-collapse:collapse}
    th,td{border:1px solid #999;padding:8px 6px;font-size:13px;text-align:left}
    th{background:#eee}
    td{height:28px}
  </style></head><body>
    <h1>Wiegeliste</h1>
    <div class="kopf">
      <div><b>Fläche:</b> ${escapeHtml(f.name)}</div>
      <div><b>Größe:</b> ${formatZahl(f.groesse_ha)} ha</div>
      <div><b>Kultur:</b> ${escapeHtml(kultur || '–')}</div>
      <div><b>Anbaujahr:</b> ${escapeHtml(anbaujahr || '')}</div>
      <div><b>Datum:</b> _______________</div>
    </div>
    <table>
      <thead><tr><th>Nr.</th><th>Fahrzeug</th><th>Leergewicht (kg)</th><th>Vollgewicht (kg)</th><th>Feuchte (%)</th><th>Bemerkung</th></tr></thead>
      <tbody>${zeilenHtml}</tbody>
    </table>
  </body></html>`;
  const fenster = window.open('', '_blank');
  if (!fenster){ toast('Popup wurde blockiert – bitte Popups für diese Seite erlauben.'); return; }
  fenster.document.write(html);
  fenster.document.close();
  fenster.focus();
  fenster.print();
}

  const f = state.flaechen.find(x => x.id === ertragFlaeche);

    .sort((a,b) => (parseAnbaujahr(b.anbaujahr)||0) - (parseAnbaujahr(a.anbaujahr)||0));

  const rows = listen.map(w => {
    const gesamt = (w.wiegungen||[]).reduce((s,x) => s + Math.max(0,(parseFloat(x.vollgewicht)||0) - (parseFloat(x.leergewicht)||0)), 0);
    const ertragDtHa = f && f.groesse_ha ? (gesamt/100) / parseFloat(f.groesse_ha) : 0;
    return `
      <div class="row">
        <div>
          <div class="name">Anbaujahr ${escapeHtml(w.anbaujahr)}</div>
          <div class="sub">${formatDatum(w.datum)} · ${(w.wiegungen||[]).length} Wiegung(en)</div>

          <div class="amount">${formatZahl(ertragDtHa)} dt/ha</div>

            <button class="btn btn-sm btn-danger" data-delete-wiegung="${w.id}">Löschen</button>
          </div>
        </div>
      </div>`;
  }).join('') || '<div class="empty">Noch keine Wiegeliste für diese Fläche.</div>';

  return `
    <a class="back-link" data-view-link="mehr">← Zurück</a>
    <div class="card">
      <h2 style="display:flex;justify-content:space-between;align-items:center">
        <span>${escapeHtml(f ? f.name : '')}</span>
        <button class="btn btn-sm btn-outline" id="erFlaecheWechseln">Fläche wechseln</button>
      </h2>
      ${rows}

    <div class="card">
      <button class="btn btn-primary" id="erNeueWiegeliste">+ Neue Wiegeliste</button>
      <div class="btn-row" style="margin-top:10px">
        <input type="text" id="erDruckJahr" placeholder="Anbaujahr, z.B. 26/27" value="${escapeHtml(datumZuAnbaujahr(heute()) || '')}" style="flex:1">
        <button class="btn btn-outline" id="erDrucken">🖨️ Leere Wiegeliste drucken</button>
      </div>
    </div>
  `;
}

/* ---------- DASHBOARD ---------- */
function renderDashboard(){
  const jahre = alleAnbaujahre();
  if (jahre.length === 0){
    return `<a class="back-link" data-view-link="mehr">← Zurück</a><div class="card"><div class="empty">Noch keine Anbauplanung erfasst – Dashboard wird daraus berechnet.</div></div>`;
  }

  const groesseByFlaeche = {};
  state.flaechen.forEach(f => { groesseByFlaeche[f.id] = parseFloat(f.groesse_ha) || 0; });

  const tabellen = jahre.map(jahr => {
    const eintraege = state.anbauplanung.filter(p => p.anbaujahr === jahr);
    const flaecheByKultur = {};
    let summe = 0;
    eintraege.forEach(e => {
      if (!e.kultur) return;
      const ha = groesseByFlaeche[e.flaeche_id] || 0;
      flaecheByKultur[e.kultur] = (flaecheByKultur[e.kultur] || 0) + ha;
      summe += ha;
    });
    const zfByName = {};
    eintraege.forEach(e => {
      if (!e.zwischenfrucht) return;
      const ha = groesseByFlaeche[e.flaeche_id] || 0;
      zfByName[e.zwischenfrucht] = (zfByName[e.zwischenfrucht] || 0) + ha;
    });

    function flaechenListe(filterFn){
      return eintraege.filter(filterFn).map(e => {
        const f = state.flaechen.find(x => x.id === e.flaeche_id);
        return `<div class="row" data-open-flaeche="${e.flaeche_id}" style="cursor:pointer;padding-left:16px">
          <div class="name">${escapeHtml(f ? f.name : '?')}</div>
          <div>${formatZahl(groesseByFlaeche[e.flaeche_id] || 0)} ha</div>
        </div>`;
      }).join('');
    }

    const kulturRows = Object.entries(flaecheByKultur).sort((a,b) => b[1]-a[1]).map(([k,ha]) => {
      const anteil = summe > 0 ? (ha/summe*100) : 0;
      const warnung = anteil > 30;
      const key = jahr + '__k__' + k;
      const offen = dashboardExpandiert.has(key);
      return `
        <div class="row" data-toggle-dash="${key}" style="cursor:pointer;${warnung ? 'color:var(--red)' : ''}">
          <div class="name">${offen ? '▾' : '▸'} ${escapeHtml(k)}</div>
          <div>${formatZahl(ha)} ha (${formatZahl(anteil)} %)</div>
        </div>
        ${offen ? flaechenListe(e => e.kultur === k) : ''}`;
    }).join('') || '<div class="empty">Keine Kultur zugeordnet.</div>';

    const zfRows = Object.entries(zfByName).sort((a,b) => b[1]-a[1]).map(([z,ha]) => {
      const key = jahr + '__z__' + z;
      const offen = dashboardExpandiert.has(key);
      return `
        <div class="row" data-toggle-dash="${key}" style="cursor:pointer">
          <div class="name">${offen ? '▾' : '▸'} ${escapeHtml(z)}</div>
          <div>${formatZahl(ha)} ha</div>
        </div>
        ${offen ? flaechenListe(e => e.zwischenfrucht === z) : ''}`;
    }).join('') || '<div class="empty">Keine Zwischenfrucht.</div>';

    return `
      <div class="card">
        <h2>Anbaujahr ${escapeHtml(jahr)}</h2>
        <div class="sub" style="margin-bottom:8px">Gesamt: ${formatZahl(summe)} ha · rot = über 30% Flächenanteil</div>
        ${kulturRows}
        <div class="sub" style="margin:10px 0 6px">Zwischenfrüchte</div>
        ${zfRows}
      </div>
    `;
  }).join('');

  return `<a class="back-link" data-view-link="mehr">← Zurück</a>${tabellen}`;
}

function renderSuchergebnisse(query, containerId, onSelect, nurKennrs){
  const container = document.getElementById(containerId);
  if (!query || query.length < 2){ container.classList.add('hidden'); container.innerHTML=''; return; }
  const q = query.toLowerCase();
  const treffer = [];
  const seen = new Set();
  state.katalog.forEach(k => {
    if (nurKennrs && !nurKennrs.has(k.kennr)) return;
    const nameTreffer = k.handelsname && k.handelsname.toLowerCase().includes(q);
    const wirkstoffTreffer = k.wirkstoffe && k.wirkstoffe.toLowerCase().includes(q);
    if ((nameTreffer || wirkstoffTreffer) && !seen.has(k.kennr)){
      seen.add(k.kennr);
      treffer.push(k);
    }
  });
  if (treffer.length === 0){
    container.innerHTML = `<div>${nurKennrs ? 'Kein Treffer im Lagerbestand.' : 'Keine Treffer im Katalog.'}</div>`;
    container.classList.remove('hidden');
    return;
  }
  const bestand = berechneBestand();
  container.innerHTML = treffer.slice(0, 20).map(k => {
    const b = bestand.find(p => p.kennr === k.kennr);
    const bestandText = b ? `${formatZahl(b.gesamt)} ${escapeHtml(b.einheit || '')} im Bestand` : '0 im Bestand';
    return `<div data-kennr="${k.kennr}">${escapeHtml(k.handelsname)}<small>${escapeHtml(k.kultur_name || '')} · ${escapeHtml(bestandText)}${k.wirkstoffe ? ' · ' + escapeHtml(k.wirkstoffe) : ''}</small></div>`;
  }).join('');
  container.classList.remove('hidden');
  container.querySelectorAll('div[data-kennr]').forEach(el => {
    el.onclick = () => {
      const item = treffer.find(t => t.kennr === el.dataset.kennr);
      onSelect(item);
    };
  });
}

/* ---- Aktionen ---- */
/** Erzeugt aus einem manuell eingegebenen Produktnamen einen stabilen Schlüssel,
 *  damit spätere Buchungen desselben Produkts im selben Bestand landen. */
function manuelleKennr(name){
  return 'MANUELL:' + name.trim().toLowerCase().replace(/\s+/g, ' ');
}

/** Alle bisher manuell erfassten Produkte (auch mit Bestand 0, für Nachbestellungen), dedupliziert. */
/** Die zuletzt verwendeten BVL-Mittel (nach Zeitstempel der Buchung, dedupliziert), für Schnellzugriff beim Einbuchen. */
function letzteVerwendeteMittel(limit){
  limit = limit || 6;
  const gesehen = new Set();
  const ergebnis = [];
  state.buchungen
    .filter(b => b.kennr && !b.kennr.startsWith('MANUELL:'))
    .slice()
    .sort((a,b) => (b.zeitstempel || '').localeCompare(a.zeitstempel || ''))
    .forEach(b => {
      if (!gesehen.has(b.kennr) && ergebnis.length < limit){
        gesehen.add(b.kennr);
        ergebnis.push({ kennr: b.kennr, handelsname: b.handelsname });
      }
    });
  return ergebnis;
}

function manuelleProdukteListe(){
  const gesehen = new Set();
  const ergebnis = [];
  state.buchungen
    .filter(b => (b.kennr || '').startsWith('MANUELL:'))
    .forEach(b => {
      if (!gesehen.has(b.kennr)){
        gesehen.add(b.kennr);
        ergebnis.push({ kennr: b.kennr, handelsname: b.handelsname });
      }
    });
  return ergebnis.sort((a,b) => a.handelsname.localeCompare(b.handelsname, 'de'));
}

async function handleEinbuchen(){
  let kennr, handelsname;
  if (einbuchenDraft.manuell){
    handelsname = document.getElementById('einManuellName').value.trim();
    if (!handelsname){ toast('Bitte Produktnamen eingeben.'); return; }
    kennr = manuelleKennr(handelsname);
  } else {
    kennr = document.getElementById('einKennr').value;
    handelsname = document.getElementById('einHandelsname').value;
  }
  const menge = document.getElementById('einMenge').value;
  if (!kennr || !menge){ toast('Bitte Produkt und Menge angeben.'); return; }

  // Weitere Chargen derselben Lieferung müssen vollständig ausgefüllt sein
  const weitereUnvollstaendig = einbuchenDraft.weitereChargen.some(wc => !wc.charge || !wc.menge);
  if (weitereUnvollstaendig){ toast('Bitte bei jeder weiteren Charge Chargennummer und Menge angeben (oder die Zeile entfernen).'); return; }

  const einheit = document.getElementById('einEinheit').value;
  const datum = document.getElementById('einDatum').value;
  const person = document.getElementById('einPerson').value;

  const alleChargen = [
    { charge: document.getElementById('einCharge').value, menge },
    ...einbuchenDraft.weitereChargen
  ];

  try{
    for (const eintrag of alleChargen){
      await apiPost('addBuchung', {
        kennr, handelsname, typ: 'Einbuchung', menge: eintrag.menge,
        einheit, datum, charge: eintrag.charge, person
      });
      // Nach jedem erfolgreichen Schritt sofort aus der Warteliste entfernen, damit ein
      // Klick auf "Einbuchen" nach einem Teilfehler nicht bereits Gebuchtes wiederholt.
      if (eintrag === alleChargen[0]){
        einbuchenDraft.charge = ''; einbuchenDraft.menge = '';
      } else {
        einbuchenDraft.weitereChargen = einbuchenDraft.weitereChargen.filter(wc => wc !== eintrag);
      }
    }
    toast(alleChargen.length > 1 ? `${alleChargen.length} Chargen eingebucht.` : 'Eingebucht.');
    // Produkt zurücksetzen, Datum + Person für die nächste Buchung behalten
    einbuchenDraft.suche = ''; einbuchenDraft.kennr = ''; einbuchenDraft.handelsname = '';
    einbuchenDraft.manuellName = '';
    await syncOperativeData(false);
    render();
  }catch(err){ toast('Fehler: ' + err.message); }
}

function ausChargenOptionenHtml(kennr, selectedCharge){
  const bestand = berechneBestand().find(p => p.kennr === kennr);
  if (!bestand) return '<option value="">–</option>';
  const optionen = Object.entries(bestand.chargen)
    .filter(([,m]) => Math.abs(m) > 0.0001)
    .map(([c,m]) => `<option value="${escapeHtml(c)}" ${selectedCharge === c ? 'selected' : ''}>${escapeHtml(c)} (${formatZahl(m)} ${escapeHtml(bestand.einheit || '')} verfügbar)</option>`).join('');
  return '<option value="">– wählen –</option>' + optionen;
}

/** Berechnet die Tankfüllungen (inkl. Restfüllung) für eine Menge Produkte/Fläche/Wasser/Tank. */
/** Liefert nur die Liste der Wassermengen je Tankfüllung (inkl. Restfüllung), ohne HTML. */
function berechneFuellungenArray(flaechenGesamt, wasserProHa, tankMax){
  if (!wasserProHa || !tankMax || flaechenGesamt === 0) return { fuellungen: [], rest: 0, vollTanks: 0 };
  const wasserGesamt = wasserProHa * flaechenGesamt;
  const vollTanks = Math.floor(wasserGesamt / tankMax + 1e-9);
  const rest = wasserGesamt - vollTanks * tankMax;
  const fuellungen = [];
  for (let i = 0; i < vollTanks; i++) fuellungen.push(tankMax);
  if (rest > 0.01) fuellungen.push(rest);
  return { fuellungen, rest, vollTanks };
}

function berechneTankfuellungenHtml(produkte, flaechenGesamt, wasserProHa, tankMax){
  if (!wasserProHa || !tankMax || flaechenGesamt === 0 || produkte.length === 0){
    return '<div class="result-box">Keine vollständigen Angaben zur Spritzplanung vorhanden.</div>';
  }
  const wasserGesamt = wasserProHa * flaechenGesamt;
  const { fuellungen, rest, vollTanks } = berechneFuellungenArray(flaechenGesamt, wasserProHa, tankMax);

  const fuellungenHtml = fuellungen.map((wasserImTank, i) => {
    const haInDieserFuellung = wasserImTank / wasserProHa;
    const produktZeilen = produkte.map(p => {
      const aufwand = parseFloat(p.aufwand_pro_ha) || 0;
      const menge = aufwand * haInDieserFuellung;
      return `<div>${escapeHtml(p.handelsname)}: ${formatZahl(menge)} ${escapeHtml(p.einheit || '')} einmischen</div>`;
    }).join('');
    return `
      <div class="result-box" style="margin-top:${i === 0 ? '10' : '8'}px">
        <b>Tankfüllung ${i + 1}${i === fuellungen.length - 1 && rest > 0.01 && vollTanks > 0 ? ' (Rest)' : ''}: ${formatZahl(wasserImTank)} l Wasser (${formatZahl(haInDieserFuellung)} ha)</b>
        <div style="margin-top:6px">${produktZeilen}</div>
      </div>`;
  }).join('');

  return `
    <div class="result-box">
      <b>Gesamtfläche: ${formatZahl(flaechenGesamt)} ha</b>
      <div>Wasser gesamt: ${formatZahl(wasserGesamt)} l</div>
      <div>Anzahl Tankfüllungen: ${fuellungen.length}</div>
    </div>
    ${fuellungenHtml}
  `;
}

/** Wie berechneTankfuellungenHtml, aber mit Haken pro Tankfüllung zum Abhaken während der Ausbringung. */
function berechneTankfuellungenInteraktivHtml(m, produkte, flaechenGesamt, wasserProHa, tankMax){
  if (!wasserProHa || !tankMax || flaechenGesamt === 0 || produkte.length === 0){
    return '<div class="result-box">Keine vollständigen Angaben zur Spritzplanung vorhanden.</div>';
  }
  const wasserGesamt = wasserProHa * flaechenGesamt;
  const { fuellungen, rest, vollTanks } = berechneFuellungenArray(flaechenGesamt, wasserProHa, tankMax);
  const erledigt = m.tankfuellungenErledigt || [];

  const fuellungenHtml = fuellungen.map((wasserImTank, i) => {
    const haInDieserFuellung = wasserImTank / wasserProHa;
    const istErledigt = erledigt.includes(i);
    const produktZeilen = produkte.map(p => {
      const aufwand = parseFloat(p.aufwand_pro_ha) || 0;
      const menge = aufwand * haInDieserFuellung;
      return `<div>${escapeHtml(p.handelsname)}: ${formatZahl(menge)} ${escapeHtml(p.einheit || '')} einmischen</div>`;
    }).join('');
    return `
      <div class="result-box" style="margin-top:${i === 0 ? '10' : '8'}px">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
          <label style="display:flex;align-items:center;gap:8px;margin:0;flex:1">
            <input type="checkbox" data-tankfuellung-check="${i}" data-massnahme-id="${m.id}" ${istErledigt ? 'checked' : ''} style="width:20px;height:20px">
            <b>Tankfüllung ${i + 1}${i === fuellungen.length - 1 && rest > 0.01 && vollTanks > 0 ? ' (Rest)' : ''}: ${formatZahl(wasserImTank)} l Wasser (${formatZahl(haInDieserFuellung)} ha)</b>
          </label>
          ${istErledigt ? '<span class="badge ok">erledigt</span>' : ''}
        </div>
        <div style="margin-top:6px">${produktZeilen}</div>
      </div>`;
  }).join('');

  return `
    <div class="result-box">
      <b>Gesamtfläche: ${formatZahl(flaechenGesamt)} ha</b>
      <div>Wasser gesamt: ${formatZahl(wasserGesamt)} l</div>
      <div>Anzahl Tankfüllungen: ${fuellungen.length}</div>
    </div>
    ${fuellungenHtml}
  `;
}

function berechneFlaechenGesamt(flaechenIds, override){
  const auto = flaechenIds.reduce((sum, id) => {
    const f = state.flaechen.find(x => x.id === id);
    return sum + (f ? parseFloat(f.groesse_ha) || 0 : 0);
  }, 0);
  const overrideNum = parseFloat(override);
  return (override !== '' && override !== null && override !== undefined && !isNaN(overrideNum)) ? overrideNum : auto;
}

async function handleMassnahmeErledigen(e){

    const bestand = berechneBestand().find(b => b.kennr === sel.dataset.kennr);
    // Die Ausbuchung muss in der Einheit des tatsächlichen Bestands erfolgen, sonst
    // vermischen sich z.B. kg-Einbuchungen mit g-Ausbuchungen im selben Bestand.
    const bestandEinheit = bestand ? bestand.einheit : sel.dataset.einheit;
    const menge = konvertiereMenge(mengeInPlanEinheit, sel.dataset.einheit, bestandEinheit);
    chargenAuswahl.push({
      kennr: sel.dataset.kennr,
      handelsname: sel.dataset.handelsname,
      charge,
      menge,
      einheit: bestandEinheit || ''
    });
  });
  if (fehlt){ toast('Bitte für jedes Produkt eine Charge wählen.'); return; }

  const person = document.getElementById('erlPerson').value;
  const datum = document.getElementById('erlDatum').value;
  if (!person){ toast('Bitte Person angeben.'); return; }

  try{
    await apiPost('erledigeMassnahme', { massnahmeId, person, datum, chargenAuswahl });

    setView('arbeiten');

/* ============================================================
   UTIL
   ============================================================ */
function escapeHtml(str){
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatZahl(n){
  const num = parseFloat(n);
  if (isNaN(num)) return '0';
  return num.toLocaleString('de-DE', { maximumFractionDigits: 2 });
}
function formatDatum(iso){
  if (!iso) return '–';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso);
  return d.toLocaleDateString('de-DE');
}
function heute(){
  return new Date().toISOString().slice(0,10);
}

/* ============================================================
   BARCODE-SCANNER (für Chargennummer)
   ============================================================ */
let scannerStream = null;
let scannerLaeuft = false;

/**
 * Öffnet die Kamera und versucht, einen Barcode/QR-Code zu erkennen. Nutzt die
 * native BarcodeDetector-API des Browsers (verfügbar z.B. in Chrome/Edge auf
 * Android und Desktop). Safari/iOS unterstützt diese API bisher nicht – dort
 * erscheint stattdessen ein Hinweis, die Chargennummer manuell einzutippen.
 */
async function starteBarcodeScan(onErkannt){
  if (!('BarcodeDetector' in window)){
    toast('Dein Browser unterstützt keine Barcode-Erkennung. Bitte Chargennummer manuell eingeben.');
    return;
  }
  const overlay = document.getElementById('scannerOverlay');
  const video = document.getElementById('scannerVideo');
  try{
    scannerStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  }catch(err){
    toast('Kein Kamerazugriff möglich: ' + err.message);
    return;
  }
  video.srcObject = scannerStream;
  overlay.classList.remove('hidden');
  scannerLaeuft = true;

  const detector = new BarcodeDetector({ formats: ['code_128', 'code_39', 'ean_13', 'ean_8', 'qr_code'] });

  const suchschleife = async () => {
    if (!scannerLaeuft) return;
    try{
      const treffer = await detector.detect(video);
      if (treffer.length > 0){
        const code = treffer[0].rawValue;
        beendeBarcodeScan();
        onErkannt(code);
        return;
      }
    }catch(err){ /* einzelner Frame fehlgeschlagen, einfach weiter versuchen */ }
    if (scannerLaeuft) requestAnimationFrame(suchschleife);
  };
  suchschleife();
}

function beendeBarcodeScan(){
  scannerLaeuft = false;
  if (scannerStream){
    scannerStream.getTracks().forEach(track => track.stop());
    scannerStream = null;
  }
  document.getElementById('scannerOverlay').classList.add('hidden');
}

document.getElementById('scannerAbbrechen').onclick = beendeBarcodeScan;

/** Exportiert alle Buchungen als CSV-Datei (deutsches Format: Semikolon-getrennt,
 *  UTF-8 mit BOM für korrekte Umlaute in Excel). Für Kontrollen/Ackerschlagdatei. */
function exportiereBuchungenCsv(von, bis){
  const header = ['Datum', 'Handelsname', 'Typ', 'Menge', 'Einheit', 'Charge', 'Person', 'Kommentar'];
  const zeilen = state.buchungen
    .filter(b => (!von || (b.datum || '') >= von) && (!bis || (b.datum || '') <= bis))
    .slice()
    .sort((a,b) => (a.datum || '').localeCompare(b.datum || ''))
    .map(b => [b.datum || '', b.handelsname || '', b.typ || '', b.menge, b.einheit || '', b.charge || '', b.person || '', b.kommentar || '']);

  if (zeilen.length === 0){ toast('Keine Buchungen im gewählten Zeitraum.'); return; }

  const csvZeile = row => row.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(';');
  const csv = [csvZeile(header), ...zeilen.map(csvZeile)].join('\r\n');
  const dateiname = 'psm-buchungen' + (von || bis ? `_${von || 'anfang'}_bis_${bis || 'heute'}` : '') + '.csv';
  ladeCsvHerunter(csv, dateiname);
}

/** Exportiert eine Momentaufnahme des aktuellen Lagerbestands (inkl. Produkte mit 0 Bestand). */
function exportiereBestandCsv(){
  const header = ['Handelsname', 'Kultur(en)', 'Wirkstoffe', 'Menge', 'Einheit', 'Status'];
  const bestand = berechneBestand(true);
  const zeilen = bestand
    .slice()
    .sort((a,b) => a.handelsname.localeCompare(b.handelsname, 'de'))
    .map(p => {
      const katalog = katalogEintrag(p.kennr);
      const kulturen = [...new Set(katalog.map(k => k.kultur_name).filter(Boolean))].join(', ');
      const wirkstoffe = [...new Set(katalog.map(k => k.wirkstoffe).filter(Boolean))].join(', ');
      const leer = Math.abs(p.gesamt) <= 0.0001;
      return [p.handelsname || p.kennr, kulturen, wirkstoffe, leer ? 0 : p.gesamt, p.einheit || '', leer ? 'nicht auf Lager' : 'auf Lager'];
    });

  if (zeilen.length === 0){ toast('Kein Bestand vorhanden.'); return; }

  const csvZeile = row => row.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(';');
  const csv = [csvZeile(header), ...zeilen.map(csvZeile)].join('\r\n');
  ladeCsvHerunter(csv, 'psm-bestand_' + heute() + '.csv');
}

function ladeCsvHerunter(csv, dateiname){
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = dateiname;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/**
 * Öffnet ein neues Fenster mit einer druckfreundlichen Tabelle und startet den
 * Browser-Druckdialog. Dort kann als Ziel-Drucker "Als PDF speichern" (Windows/Chrome)
 * bzw. "In Dateien sichern" / "Print to PDF" (Mac/iOS/Android) gewählt werden – so
 * entsteht ein PDF ohne dass die App selbst eine PDF-Bibliothek mitbringen muss.
 */
function oeffneDruckansicht(titel, spalten, zeilen){
  const fenster = window.open('', '_blank');
  if (!fenster){ toast('Popup wurde vom Browser blockiert – bitte Popups für diese Seite erlauben.'); return; }
  const tabelleHtml = `
    <table>
      <thead><tr>${spalten.map(s => `<th>${escapeHtml(s)}</th>`).join('')}</tr></thead>
      <tbody>${zeilen.map(z => `<tr>${z.map(v => `<td>${escapeHtml(String(v == null ? '' : v))}</td>`).join('')}</tr>`).join('')}</tbody>
    </table>
  `;
  fenster.document.write(`
    <!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><title>${escapeHtml(titel)}</title>
    <style>
      body{font-family:Arial,sans-serif;padding:20px;color:#222}
      h1{font-size:18px;margin-bottom:4px}
      .datum{color:#666;font-size:12px;margin-bottom:16px}
      table{width:100%;border-collapse:collapse;font-size:12px}
      th,td{border:1px solid #ccc;padding:6px 8px;text-align:left}
      th{background:#f0f0f0}
      @media print{ body{padding:0} }
    </style></head>
    <body>
      <h1>${escapeHtml(titel)}</h1>
      <div class="datum">Erstellt am ${new Date().toLocaleDateString('de-DE')} ${new Date().toLocaleTimeString('de-DE')}</div>
      ${tabelleHtml}
      <script>window.onload = () => window.print();<\/script>
    </body></html>
  `);
  fenster.document.close();
}
